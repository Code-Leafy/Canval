              }
            },
            { divider: true },
            { header: 'Snapping' },
            {
              label: 'Snap Cards to Grid',
              icon: Icons.magnet,
              active: isSnap,
              action: () => {
                s.snap = !s.snap;
                this.updateGridButtonState();
                this.scheduleSave();
                this.toast(s.snap ? 'Snap enabled' : 'Snap disabled');
              }
            }
          ];

          this.showMenu(x, y, items);
        },

        zoomAt(clientX, clientY, factor) {
          const viewport = document.getElementById('canvas-viewport');
          const rect = viewport.getBoundingClientRect();
          const cam = this.currentProject.camera;
          const px = clientX - rect.left;
          const py = clientY - rect.top;

          const wx = (px - cam.x) / cam.zoom;
          const wy = (py - cam.y) / cam.zoom;

          cam.zoom = Math.min(2.2, Math.max(0.25, cam.zoom * factor));
          cam.x = px - wx * cam.zoom;
          cam.y = py - wy * cam.zoom;

          this.applyCamera();
          this.scheduleSave();
          this.scheduleRefit();
        },

        fitAll() {
          const p = this.currentProject;
          const all = [...(p.terminals || []), ...(p.notes || [])];
          if (!all.length) return;

          const viewport = document.getElementById('canvas-viewport');
          const rect = viewport.getBoundingClientRect();

          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          all.forEach(item => {
            minX = Math.min(minX, item.x);
            minY = Math.min(minY, item.y);
            maxX = Math.max(maxX, item.x + item.w);
            maxY = Math.max(maxY, item.y + item.h);
          });

          const pad = 100;
          const targetW = maxX - minX + pad * 2;
          const targetH = maxY - minY + pad * 2;

          const zX = rect.width / targetW;
          const zY = rect.height / targetH;
          const newZoom = Math.min(1.4, Math.max(0.3, Math.min(zX, zY)));

          p.camera.zoom = newZoom;
          p.camera.x = (rect.width - (maxX - minX) * newZoom) / 2 - minX * newZoom;
          p.camera.y = (rect.height - (maxY - minY) * newZoom) / 2 - minY * newZoom;

          this.applyCamera();
          this.scheduleSave();
          this.scheduleRefit();
        },

        /* --- Minimap Birds-Eye View Navigation --- */
        initMinimap() {
          if (true) return; // Minimap parked (see .canvas-minimap-container CSS).
          const body = document.getElementById('minimap-body');
          const toggleBtn = document.getElementById('btn-toggle-minimap');
          const container = document.getElementById('canvas-minimap-container');
          if (!body || !toggleBtn || !container) return;

          document.getElementById('btn-minimap-zout').innerHTML = Icons.minus;
          document.getElementById('btn-minimap-zin').innerHTML = Icons.plus;
          document.getElementById('btn-minimap-zout').onclick = (e) => {
            e.stopPropagation();
            this.minimapZoom = Math.max(0.5, (this.minimapZoom || 1) / 1.3);
            this.updateMinimap();
          };
          document.getElementById('btn-minimap-zin').onclick = (e) => {
            e.stopPropagation();
            this.minimapZoom = Math.min(4, (this.minimapZoom || 1) * 1.3);
            this.updateMinimap();
          };

          toggleBtn.onclick = (e) => {
            e.stopPropagation();
            container.classList.toggle('collapsed');
            const isCollapsed = container.classList.contains('collapsed');
            toggleBtn.title = isCollapsed ? 'Expand Minimap' : 'Collapse Minimap';
            toggleBtn.innerHTML = isCollapsed
              ? Icons.chevronUp
              : Icons.chevronDown;
          };

          const panToMinimapPoint = (clientX, clientY) => {
            if (!this.minimapTransform || !this.currentProject) return;
            const rect = body.getBoundingClientRect();
            const K = this.minimapTransform.K || 1;
            const clickX = Math.max(0, Math.min(rect.width, clientX - rect.left)) * K;
            const clickY = Math.max(0, Math.min(rect.height, clientY - rect.top)) * K;

            const { minX, minY, scale, offX, offY } = this.minimapTransform;
            const targetWorldX = (clickX - offX) / scale + minX;
            const targetWorldY = (clickY - offY) / scale + minY;

            const vpEl = document.getElementById('canvas-viewport');
            const vpRect = vpEl ? vpEl.getBoundingClientRect() : { width: 800, height: 600 };
            const cam = this.currentProject.camera;

            cam.x = vpRect.width / 2 - targetWorldX * cam.zoom;
            cam.y = vpRect.height / 2 - targetWorldY * cam.zoom;

            this.applyCamera();
            this.scheduleSave();
          };

          let isDragging = false;
          body.onmousedown = (e) => {
            e.stopPropagation();
            isDragging = true;
            panToMinimapPoint(e.clientX, e.clientY);

            const onMove = (ev) => {
              if (!isDragging) return;
              if (ev.buttons === 0) {
                isDragging = false;
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                return;
              }
              panToMinimapPoint(ev.clientX, ev.clientY);
            };
            const onUp = () => {
              isDragging = false;
              window.removeEventListener('mousemove', onMove);
              window.removeEventListener('mouseup', onUp);
            };
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
          };
        },

        updateMinimap() {
          return; // Minimap parked (see .canvas-minimap-container CSS).
          // Coalesce rapid calls (drag / wheel / zoom) into one paint per frame.
          if (this._mmQueued) return;
          this._mmQueued = true;
          requestAnimationFrame(() => {
            this._mmQueued = false;
            this._drawMinimap();
          });
        },

        // Live terminal text for the minimap (falls back to saved scrollback).
        minimapTermLines(item) {
          if (!DEMO) {
            try {
              const rec = this.ptyMap.get(item.id);
              if (rec && rec.term && rec.term.buffer && rec.term.buffer.active) {
                const buf = rec.term.buffer.active;
                const lines = [];
                const n = Math.min(16, buf.length);
                for (let i = Math.max(0, buf.length - n); i < buf.length; i++) {
                  const ln = buf.getLine(i);
                  if (ln) {
                    const t = ln.translateToString(true).trimEnd();
                    if (t.trim().length) lines.push(t);
                  }
                }
                if (lines.length) return lines.slice(-60);
              }
            } catch (e) {}
          }
          return (item.history || []).map(h => (h && h.text) || '').filter(s => s.trim().length).slice(-60);
        },

        _drawMinimap() {
          if (this.view !== 'canvas' || !this.currentProject) return;
          const canvas = document.getElementById('minimap-canvas');
          const vpBox = document.getElementById('minimap-viewport-box');
          if (!canvas || !vpBox) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const p = this.currentProject;
          const allItems = [...(p.terminals || []), ...(p.notes || [])];
          const cam = p.camera;
          const vpEl = document.getElementById('canvas-viewport');
          const vpRect = vpEl ? vpEl.getBoundingClientRect() : { width: 800, height: 600 };

          // World viewport visible boundaries
          const curVwX = -cam.x / cam.zoom;
          const curVwY = -cam.y / cam.zoom;
          const curVwW = vpRect.width / cam.zoom;
          const curVwH = vpRect.height / cam.zoom;

          // Calculate bounding box encompassing cards and camera view
          let minX = curVwX;
          let minY = curVwY;
          let maxX = curVwX + curVwW;
          let maxY = curVwY + curVwH;

          allItems.forEach(item => {
            minX = Math.min(minX, item.x);
            minY = Math.min(minY, item.y);
            maxX = Math.max(maxX, item.x + item.w);
            maxY = Math.max(maxY, item.y + item.h);
          });

          // World coordinates padding
          const pad = 240;
          minX -= pad;
          minY -= pad;
          maxX += pad;
          maxY += pad;

          const worldW = Math.max(1, maxX - minX);
          const worldH = Math.max(1, maxY - minY);

          const mW = canvas.width;
          const mH = canvas.height;
          const cssW = (canvas.parentElement && canvas.parentElement.clientWidth) || 216;
          const K = mW / Math.max(1, cssW); // supersample factor (2x backing store)
          const scale = Math.min(mW / worldW, mH / worldH) * (this.minimapZoom || 1);

          // Center the content on minimap canvas
          const offX = (mW - worldW * scale) / 2;
          const offY = (mH - worldH * scale) / 2;

          // Save transformation for mouse interaction
          this.minimapTransform = { minX, minY, scale, offX, offY, mW, mH, K };

          // Clear
          ctx.clearRect(0, 0, mW, mH);

          // Fluent background (follows app theme)
          const mmLight = document.documentElement.dataset.theme === 'light';
          ctx.fillStyle = mmLight ? '#f2f2f2' : '#171717';
          ctx.fillRect(0, 0, mW, mH);

          // Grid hints
          ctx.strokeStyle = mmLight ? 'rgba(0, 0, 0, 0.05)' : 'rgba(255, 255, 255, 0.03)';
          ctx.lineWidth = Math.max(1, K * 0.5);
          for (let x = 0; x < mW; x += 18 * K) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, mH);
            ctx.stroke();
          }
          for (let y = 0; y < mH; y += 18 * K) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(mW, y);
            ctx.stroke();
          }

          // Draw orthogonal wires matching canvas routing
          const wires = p.wires || [];
          ctx.lineWidth = Math.max(1, K * 0.6);
          wires.forEach(w => {
            const f = this.findCard(w.fromId);
            const t = this.findCard(w.toId);
            if (!f || !t) return;
            const p1 = this.getPortCoord(f, w.fromPort || 'e');
            const p2 = this.getPortCoord(t, w.toPort || 'w');
            const info = this.calculateOrthogonalPath(p1, p2, w.fromPort || 'e', w.toPort || 'w', w.fromId, w.toId);
            const isSel = this.selectedId === 'wire:' + w.id;

            ctx.strokeStyle = w.color || (isSel ? (mmLight ? '#0078d4' : '#60cdff') : (mmLight ? 'rgba(0, 0, 0, 0.3)' : 'rgba(255, 255, 255, 0.28)'));
            ctx.beginPath();
            ctx.setLineDash(w.dash ? w.dash.split(' ').map(Number) : []);
            info.waypoints.forEach((pt, i) => {
              const mx = (pt.x - minX) * scale + offX;
              const my = (pt.y - minY) * scale + offY;
              if (i === 0) ctx.moveTo(mx, my);
              else ctx.lineTo(mx, my);
            });
            ctx.stroke();
            ctx.setLineDash([]);
          });

          // Draw detailed cards (text sized proportionally to each card)
          allItems.forEach(item => {
            const cx = (item.x - minX) * scale + offX;
            const cy = (item.y - minY) * scale + offY;
            const cw = Math.max(6 * K, item.w * scale);
            const ch = Math.max(5 * K, item.h * scale);
            const isSel = this.isSelected(item.id);

            if (item.preset) {
              // Terminal Card
              const foundPreset = PRESETS.find(p => p.id === item.preset) || PRESETS[0];
              const accentColor = foundPreset.color || '#a1a1aa';

              // Card base body
              ctx.fillStyle = isSel ? '#272a34' : '#1a1c22';
              ctx.beginPath();
              if (ctx.roundRect) ctx.roundRect(cx, cy, cw, ch, 3);
              else ctx.rect(cx, cy, cw, ch);
              ctx.fill();

              // Card titlebar strip
              const headerH = Math.max(2, Math.min(5, ch * 0.22));
              ctx.fillStyle = accentColor;
              ctx.beginPath();
              if (ctx.roundRect) ctx.roundRect(cx, cy, cw, headerH, [3, 3, 0, 0]);
              else ctx.rect(cx, cy, cw, headerH);
              ctx.fill();

              // Real terminal text at true miniature scale (same proportions as the card)
              const histLines = this.minimapTermLines(item);
              const tfs = Math.max(2.5, (Settings.data.fontSize || 14) * 1.25 * scale);
              if (histLines.length && ch > headerH + tfs + 6 && cw > 30) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(cx + 2, cy + headerH + 2, Math.max(1, cw - 4), Math.max(1, ch - headerH - 4));
                ctx.clip();
                ctx.font = `${tfs}px "Cascadia Code", Consolas, monospace`;
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(255,255,255,0.66)';
                let tly = cy + headerH + 3;
                for (const ln of histLines) {
                  if (tly > cy + ch - 2) break;
                  ctx.fillText(String(ln).slice(0, 56), cx + 4, tly);
                  tly += tfs;
                }
                ctx.restore();
              } else if (ch > 10 && cw > 14) {
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                const lineW = Math.max(4, cw * 0.55);
                ctx.fillRect(cx + 2, cy + headerH + 2, lineW, 1);
                if (ch > 16) {
                  ctx.fillRect(cx + 2, cy + headerH + 4, lineW * 0.75, 1);
                }
              }
            } else {
              // Note Card
              const fill = item.fill || 'rgba(40, 42, 50, 0.9)';
              ctx.fillStyle = fill;
              ctx.beginPath();

              if (ctx.roundRect) ctx.roundRect(cx, cy, cw, ch, 3);
              else ctx.rect(cx, cy, cw, ch);
              ctx.fill();

              // Real note text at true miniature scale
              const noteLines = String(item.text || '').split('\n').map(s => s.trim()).filter(s => s.length).slice(0, 60);
              const nfs = Math.max(2.5, 20 * scale);
              if (noteLines.length && ch > nfs + 10 && cw > 36) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(cx + 3, cy + 3, Math.max(1, cw - 6), Math.max(1, ch - 6));
                ctx.clip();
                ctx.font = `${nfs}px "Segoe UI", system-ui, sans-serif`;
                ctx.textBaseline = 'top';
                ctx.fillStyle = isColorLight(item.fill || '') ? 'rgba(0,0,0,0.62)' : 'rgba(255,255,255,0.6)';
                let nly = cy + 5;
                for (const ln of noteLines) {
                  if (nly > cy + ch - 2) break;
                  ctx.fillText(ln.slice(0, 52), cx + 5, nly);
                  nly += nfs;
                }
                ctx.restore();
              }
            }

            // Card outline
            ctx.strokeStyle = isSel ? '#ffffff' : 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = isSel ? 1.5 * K : 0.7 * K;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(cx, cy, cw, ch, 3);
            else ctx.rect(cx, cy, cw, ch);
            ctx.stroke();

            // Label text if big enough
            if (cw > 26 && ch > 12) {
              ctx.font = `${Math.max(10, 6 * K)}px system-ui, sans-serif`;
              ctx.textBaseline = 'alphabetic';
              ctx.textBaseline = 'alphabetic';
              ctx.fillStyle = isSel ? (mmLight ? '#0078d4' : '#ffffff') : (mmLight ? 'rgba(0, 0, 0, 0.65)' : 'rgba(255, 255, 255, 0.7)');
              const label = item.name.length > 7 ? item.name.substring(0, 6) + '..' : item.name;
              ctx.fillText(label, cx + 2, cy + ch - 2);
            }
          });

          // Viewport indicator box (transform is in backing px; box is CSS px,
          // clamped so it never leaves the minimap frame)
          const boxK = (this.minimapTransform && this.minimapTransform.K) || 1;
          const boxX = (curVwX - minX) * scale + offX;
          const boxY = (curVwY - minY) * scale + offY;
          const boxW = curVwW * scale;
          const boxH = curVwH * scale;

          const mmBody = canvas.parentElement;
          const cssBW = (mmBody && mmBody.clientWidth) || 216;
          const cssBH = (mmBody && mmBody.clientHeight) || 128;
          let bw = Math.min(cssBW, Math.max(8, Math.round(boxW / boxK)));
          let bh = Math.min(cssBH, Math.max(6, Math.round(boxH / boxK)));
          let bx = Math.max(0, Math.min(cssBW - bw, Math.round(boxX / boxK)));
          let by = Math.max(0, Math.min(cssBH - bh, Math.round(boxY / boxK)));
          vpBox.style.left = `${bx}px`;
          vpBox.style.top = `${by}px`;
          vpBox.style.width = `${bw}px`;
          vpBox.style.height = `${bh}px`;

          // Update header + zoom pill
          const titleEl = document.getElementById('minimap-title-text');
          if (titleEl) {
            titleEl.textContent = 'Minimap';
          }
          const zoomPill = document.getElementById('minimap-zoom-pill');
          if (zoomPill) {
            zoomPill.textContent = `${Math.round((this.minimapZoom || 1) * 100)}%`;
          }
        },

        /* --- Selection & Menus --- */
        selectCard(id, additive) {
          const bump = (item) => {
            this.currentProject.zCounter = (this.currentProject.zCounter || 10) + 1;
            item.z = this.currentProject.zCounter;
            const el = document.querySelector(`.canvas-card[data-id="${item.id}"]`);
            if (el) el.style.zIndex = item.z;
          };
          if (typeof id === 'string' && id.startsWith('wire:')) {
            this.selectedId = id;
            this.selectedIds = [];
          } else if (additive) {
            const i = this.selectedIds.indexOf(id);
            if (i >= 0) {
              this.selectedIds.splice(i, 1);
              this.selectedId = this.selectedIds.length ? this.selectedIds[this.selectedIds.length - 1] : null;
            } else {
              this.selectedIds.push(id);
              this.selectedId = id;
              const item = this.findCard(id);
              if (item) bump(item);
            }
          } else {
            this.selectedId = id;
            this.selectedIds = id ? [id] : [];
            const item = id && this.findCard(id);
            if (item) bump(item);
          }
          this.renderCards();
          this.drawWires();
          this.updateStatusBar();
        },

        isSelected(id) { return (this.selectedIds || []).indexOf(id) >= 0; },

        clearSelection() {
          this.selectedId = null;
          this.selectedIds = [];
          this.renderCards();
          this.drawWires();
          this.updateStatusBar();
        },

        deleteCard(id, opts) {
          const p = this.currentProject;
          this.killPty(id);
          p.terminals = (p.terminals || []).filter(t => t.id !== id);
          p.notes = (p.notes || []).filter(n => n.id !== id);
          p.wires = (p.wires || []).filter(w => w.fromId !== id && w.toId !== id);
          if (this.selectedId === id) this.selectedId = null;
          this.selectedIds = (this.selectedIds || []).filter(x => x !== id);
          this.renderCards();
          this.drawWires();
          this.scheduleSave();
          if (!opts || !opts.silent) this.toast('Item removed');
        },

        deleteSelectedCards() {
          const ids = (this.selectedIds || []).slice();
          if (!ids.length) return;
          this.selectedIds = [];
          this.selectedId = null;
          ids.forEach(id => this.deleteCard(id, { silent: true }));
          this.renderCards();
          this.drawWires();
          this.scheduleSave();
          this.toast(ids.length > 1 ? `${ids.length} cards removed` : 'Item removed');
        },

        deleteWire(wireId) {
          const p = this.currentProject;
          p.wires = (p.wires || []).filter(w => w.id !== wireId);
          if (this.selectedId === 'wire:' + wireId) this.selectedId = null;
          this.drawWires();
          this.scheduleSave();
          this.toast('Wire disconnected');
        },

        showCardContextMenu(x, y, item) {
          const isTerm = !!item.preset;
          const menuItems = [];

          if (isTerm) {
            menuItems.push({ header: 'Terminal' });
            menuItems.push({
              label: 'Change CLI Preset...',
              icon: Icons.terminal,
              action: () => this.promptChangePreset(item)
            });
            if (!DEMO) {
              menuItems.push({
                label: 'Restart Session',
                icon: Icons.restart,
                action: () => this.respawnPTY(item.id)
              });
              menuItems.push({
                label: 'Working Directory…',
                icon: Icons.folder,
                action: () => this.promptTerminalCwd(item)
              });
              menuItems.push({
                label: 'Copy Selection',
                icon: Icons.duplicate,
                action: () => {
                  const rec = this.ptyMap.get(item.id);
                  let sel = '';
                  try { sel = rec?.term.getSelection() || ''; } catch (e) {}
                  if (sel && TC) TC.clip.copy(sel).then(() => this.toast('Copied to clipboard'));
                  else this.toast('Nothing selected');
                }
              });
              menuItems.push({
                label: 'Paste',
                icon: Icons.paste,
                action: async () => {
                  const rec = this.ptyMap.get(item.id);
                  if (!rec || !TC) return;
                  const text = await TC.clip.paste();
                  if (text) { try { rec.term.paste(text); } catch (e) {} }
                }
              });
            }
            menuItems.push({
              label: 'Clear Output',
              icon: Icons.restart,
              action: () => {
                if (DEMO) {
                  item.history = [];
                  this.bindTerminalIO(item);
                } else {
                  const rec = this.ptyMap.get(item.id);
                  if (rec) { try { rec.term.clear(); } catch (e) {} }
                }
                this.scheduleSave();
                this.toast('Output cleared');
              }
            });
          } else {
            // Note options: Color only (single rounded style, no shapes)
            menuItems.push({ header: 'Color Palette' });
            menuItems.push({
              swatches: NOTE_PALETTES,
              onSelect: (color) => {
                item.fill = color;
                this.renderCards();
                this.drawWires();
                this.updateMinimap();
                this.scheduleSave();
                this.toast('Color updated');
              }
            });
            menuItems.push({
              customColor: true,
              value: item.fill,
              onSelect: (color) => {
                item.fill = color;
                this.renderCards();
                this.drawWires();
                this.updateMinimap();
                this.scheduleSave();
              }
            });

            menuItems.push({ divider: true });
          }

          menuItems.push({ divider: true });
          menuItems.push({
            label: 'Duplicate Card',
            icon: Icons.plus,
            action: () => this.duplicateCard(item)
          });
          menuItems.push({
            label: 'Bring to Front',
            icon: Icons.chevronUp,
            action: () => this.bringToFront(item)
          });
          menuItems.push({
            label: 'Send to Back',
            icon: Icons.chevronDown,
            action: () => this.sendToBack(item)
          });
          menuItems.push({
            label: 'Rename Card...',
            icon: Icons.more,
            action: () => this.promptRenameCard(item)
          });
          menuItems.push({ divider: true });
          menuItems.push({
            label: (this.selectedIds.length > 1 && this.isSelected(item.id)) ? `Delete ${this.selectedIds.length} Cards` : 'Delete Card',
            icon: Icons.trash,
            danger: true,
            action: () => {
              if (this.selectedIds.length > 1 && this.isSelected(item.id)) this.deleteSelectedCards();
              else this.deleteCard(item.id);
            }
          });

          this.showMenu(x, y, menuItems);
        },

        showCanvasContextMenu(x, y, pt) {
          const menuItems = [
            { header: 'Add Terminal' },
            {
              label: 'PowerShell Terminal',
              icon: Icons.terminal,
              action: () => this.createTerminalAt(pt.x, pt.y, 'powershell')
            },
            {
              label: 'Command Prompt Terminal',
              icon: Icons.terminal,
              action: () => this.createTerminalAt(pt.x, pt.y, 'cmd')
            },
            { divider: true },
            { header: 'Add Note' },
            {
              label: 'Note',
              icon: Icons.note,
              action: () => this.createNoteAt(pt.x, pt.y, '#2e3038')
            },
            { divider: true },
            {
              label: 'Fit All in View',
              icon: Icons.fit,
              action: () => this.fitAll()
            },
            {
              label: 'Reset Zoom (100%)',
              icon: Icons.zoomIn,
              action: () => {
                this.currentProject.camera.zoom = 1;
                this.applyCamera();
                this.scheduleSave();
              }
            }
          ];

          this.showMenu(x, y, menuItems);
        },

        duplicateCard(item) {
          const isTerm = !!item.preset;
          const clone = JSON.parse(JSON.stringify(item));
          clone.id = uid();
          clone.name = `${item.name} (Copy)`;
          clone.x = item.x + 32;
          clone.y = item.y + 32;
          clone.z = ++this.currentProject.zCounter;

          if (isTerm) {
            this.currentProject.terminals.push(clone);
          } else {
            this.currentProject.notes.push(clone);
          }
          this.renderCards();
          this.selectCard(clone.id);
          this.scheduleSave();
          this.toast('Card duplicated');
        },

        bringToFront(item) {
          this.currentProject.zCounter = (this.currentProject.zCounter || 10) + 1;
          item.z = this.currentProject.zCounter;
          const el = document.querySelector(`.canvas-card[data-id="${item.id}"]`);
          if (el) el.style.zIndex = item.z;
          this.scheduleSave();
          this.toast('Brought to front');
        },

        sendToBack(item) {
          this.currentProject.zMin = (this.currentProject.zMin == null ? 0 : this.currentProject.zMin) - 1;
          item.z = this.currentProject.zMin;
          const el = document.querySelector(`.canvas-card[data-id="${item.id}"]`);
          if (el) el.style.zIndex = item.z;
          this.scheduleSave();
          this.toast('Sent to back');
        },

        async createTerminalAt(wx, wy, presetId = 'powershell') {
          if (!DEMO && presetId !== 'custom') {
            try {
              const avail = await cliAvailability();
              if (avail && avail[presetId] === false) {
                this.showInstallHelp(presetId);
                return null;
              }
            } catch (e) {}
          }
          const preset = PRESETS.find(p => p.id === presetId) || PRESETS[0];
          const t = {
            id: uid(),
            name: preset.name,
            preset: preset.id,
            command: undefined,
            args: [],
            cwd: (this.currentProject.settings || {}).defaultCwd || Settings.data.defaultCwd || undefined,
            x: Math.round(wx - 280),
            y: Math.round(wy - 180),
            w: 560,
            h: 360,
            z: ++this.currentProject.zCounter,
            history: [{ type: 'sys', text: `${preset.name} environment started. Type 'help' for commands.` }]
          };
          this.currentProject.terminals.push(t);
          this.renderCards();
          this.selectCard(t.id);
          this.scheduleSave();
          this.toast(`Added ${preset.name}`);
          if (!DEMO && preset.id === 'custom') this.promptCustomCommand(t);
          setTimeout(() => {
            const inp = document.getElementById('term-input-' + t.id);
            if (inp) inp.focus();
          }, 60);
        },

        createNoteAt(wx, wy, fill = '#2e3038') {
          const n = {
            id: uid(),
            name: 'Quick Note',
            shape: 'rounded',
            fill,
            text: '',
            x: Math.round(wx - 140),
            y: Math.round(wy - 90),
            w: 280,
            h: 180,
            z: ++this.currentProject.zCounter
          };
          this.currentProject.notes.push(n);
          this.renderCards();
          this.selectCard(n.id);
          this.scheduleSave();
          this.toast('Note added');
        },

        promptRenameCard(item) {
          this.showModal(`
            <div class="modal-header">
              <h3>Rename</h3>
              <p>Change label for this card.</p>
            </div>
            <div class="form-field">
              <label class="form-label">Name</label>
              <input class="form-input" id="modal-inp-name" value="${esc(item.name)}" />
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" id="modal-btn-cancel">Cancel</button>
              <button class="btn btn-primary" id="modal-btn-save">Save</button>
            </div>
          `, (dialog) => {
            dialog.querySelector('#modal-btn-cancel').onclick = () => this.closeModal();
            dialog.querySelector('#modal-btn-save').onclick = () => {
              const val = dialog.querySelector('#modal-inp-name').value.trim();
              if (val) {
                item.name = val;
                this.renderCards();
                this.scheduleSave();
              }
              this.closeModal();
            };
          });
        },

        setMaxIcon(max) {
          const el = document.getElementById('cap-max-icon');
          if (el) el.innerHTML = max
            ? '<path fill="none" stroke="currentColor" d="M3 4.5h6v6H3z"/><path fill="none" stroke="currentColor" d="M2 7.5V2h5.5"/>'
            : '<path fill="none" stroke="currentColor" d="M2 2h8v8H2z"/>';
        },

        promptTerminalCwd(item) {
          if (DEMO || !TC) { this.toast('Working directory needs the desktop app'); return; }
          this.showModal(`
            <div class="modal-header">
              <h3>Working Directory</h3>
              <p>New sessions for this terminal start here. Applies on restart.</p>
            </div>
            <div class="form-field">
              <label class="form-label">Folder</label>
              <input class="form-input" id="modal-inp-cwd" value="${esc(item.cwd || '')}" placeholder="Default folder" />
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" id="modal-btn-browse">Browse…</button>
              <button class="btn btn-secondary" id="modal-btn-cancel">Cancel</button>
              <button class="btn btn-primary" id="modal-btn-save">Restart Here</button>
            </div>
          `, (dialog) => {
            dialog.querySelector('#modal-btn-browse').onclick = async () => {
              const dir = await TC.projects.pickDir();
              if (dir) dialog.querySelector('#modal-inp-cwd').value = dir;
            };
            dialog.querySelector('#modal-btn-cancel').onclick = () => this.closeModal();
            dialog.querySelector('#modal-btn-save').onclick = async () => {
              item.cwd = dialog.querySelector('#modal-inp-cwd').value.trim() || undefined;
              this.closeModal();
              this.scheduleSave();
              await this.respawnPTY(item.id);
            };
          });
        },

        promptCustomCommand(item) {
          if (DEMO) return;
          this.showModal(`
            <div class="modal-header">
              <h3>Custom CLI</h3>
              <p>Executable and arguments spawned for this terminal.</p>
            </div>
            <div class="form-field">
              <label class="form-label">Command</label>
              <input class="form-input" id="modal-inp-cmd" value="${esc(item.command || '')}" placeholder="e.g. C:\\tools\\agent.exe" />
            </div>
            <div class="form-field">
              <label class="form-label">Arguments (space separated)</label>
              <input class="form-input" id="modal-inp-args" value="${esc((item.args || []).join(' '))}" placeholder="--flag value" />
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" id="modal-btn-cancel">Cancel</button>
              <button class="btn btn-primary" id="modal-btn-save">Save &amp; Restart</button>
            </div>
          `, (dialog) => {
            dialog.querySelector('#modal-btn-cancel').onclick = () => {
              this.closeModal();
              if (!item.command) this.toast('Set a command to start this terminal (card menu → Change CLI Preset)');
            };
            dialog.querySelector('#modal-btn-save').onclick = async () => {
              item.command = dialog.querySelector('#modal-inp-cmd').value.trim() || undefined;
              item.args = dialog.querySelector('#modal-inp-args').value.trim().split(/\s+/).filter(Boolean);
              this.closeModal();
              this.scheduleSave();
              await this.respawnPTY(item.id);
            };
          });
        },

        showInstallHelp(preset) {
          const p = presetById(preset);
          const hint = CLI_INSTALL_HINTS[preset];
          const override = (Settings.data.cliPaths || {})[preset];
          this.showModal(`
            <div class="modal-header">
              <h3>${esc(p.name)} was not found</h3>
              <p>This canvas spawns real processes, and '${esc(presetProbeCmd(preset, null) || preset)}' could not be located. Desktop apps do not inherit shell profile PATH tweaks (version managers, npm globals) — point to the binary directly.</p>
            </div>
            ${hint ? `<div class="form-field"><label class="form-label">Install with</label><input class="form-input" readonly value="${esc(hint)}" onclick="this.select()" /></div>` : ''}
            <div class="form-field">
              <label class="form-label">Binary location${override ? ' (custom)' : ' (auto-detect)'}</label>
              <input class="form-input" readonly value="${esc(override || 'Not set — automatic detection')}" onclick="this.select()" />
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" id="modal-btn-cancel">Close</button>
              ${override && TC ? '<button class="btn btn-secondary" id="modal-btn-forget">Forget</button>' : ''}
              ${TC ? '<button class="btn btn-secondary" id="modal-btn-locate">Locate…</button>' : ''}
              ${hint && TC && !hint.startsWith('Install ') ? '<button class="btn btn-primary" id="modal-btn-copy">Copy Command</button>' : ''}
            </div>
          `, (dialog) => {
            dialog.querySelector('#modal-btn-cancel').onclick = () => this.closeModal();
            const cp = dialog.querySelector('#modal-btn-copy');
            if (cp) cp.onclick = async () => {
              await TC.clip.copy(hint);
              this.toast('Install command copied — paste it into a terminal');
            };
            const loc = dialog.querySelector('#modal-btn-locate');
            if (loc) loc.onclick = async () => {
              const file = await TC.projects.pickFile();
              if (!file) return;
              const next = { ...(Settings.data.cliPaths || {}), [preset]: file };
              await Settings.save({ cliPaths: next });
              try { cliAvailCache = null; } catch (e) {}
              this.closeModal();
              this.toast(`${p.name} will launch from the chosen binary`);
            };
            const fg = dialog.querySelector('#modal-btn-forget');
            if (fg) fg.onclick = async () => {
              const next = { ...(Settings.data.cliPaths || {}) };
              delete next[preset];
              await Settings.save({ cliPaths: next });
              try { cliAvailCache = null; } catch (e) {}

              this.toast('Custom location removed');

        async promptChangePreset(item) {
          let avail = null;
          try { avail = await cliAvailability(); } catch (e) {}
          const opts = PRESETS.map(p => {
            const missing = !!(avail && avail[p.id] === false);
            return `<option value="${p.id}" ${p.id === item.preset ? 'selected' : ''}${missing ? ' disabled' : ''}>${esc(p.name)}${missing ? ' — not installed' : ''}</option>`;
          }).join('');
          this.showModal(`
            <div class="modal-header">
              <h3>Change CLI Preset</h3>
              <p>Choose runtime environment and styling for this terminal.</p>
            </div>
            <div class="form-field">
              <label class="form-label">CLI Engine</label>
              <select class="form-select" id="modal-sel-preset">${opts}</select>
            </div>
            <div class="modal-actions">
              <button class="btn btn-secondary" id="modal-btn-cancel">Cancel</button>
              <button class="btn btn-primary" id="modal-btn-save">Apply</button>
            </div>
          `, (dialog) => {
            dialog.querySelector('#modal-btn-cancel').onclick = () => this.closeModal();
            dialog.querySelector('#modal-btn-save').onclick = async () => {
              item.preset = dialog.querySelector('#modal-sel-preset').value;
              const found = presetById(item.preset);
              if (found) item.name = found.name;
              if (!DEMO && found.id === 'custom' && !item.command) {
                this.closeModal();
                // Force dom re-create
                const dom = document.querySelector(`.canvas-card[data-id="${item.id}"]`);
                if (dom) dom.remove();
                this.renderCards();
                this.scheduleSave();
                this.promptCustomCommand(item);
                return;
              }
              if (DEMO) {
                this.appendTerminalLine(item, `Switched runtime environment to: ${found.name}`, 'sys');
              }
              // Force dom re-create with a clean session: kill first so the
              // rebuild below attaches exactly one fresh PTY.
              if (!DEMO) await this.killPty(item.id);
              const existingDom = document.querySelector(`.canvas-card[data-id="${item.id}"]`);
              if (existingDom) existingDom.remove();
              this.renderCards();
              this.scheduleSave();
              this.closeModal();
            };
          });
        },

        showMenu(x, y, items) {
          const container = document.getElementById('menu-container');

          let html = `<div class="context-menu">`;
          items.forEach((it, idx) => {
            if (it.divider) {
              html += '<div class="menu-divider"></div>';
            } else if (it.header) {
              html += `<div class="menu-section-label">${it.header}</div>`;
            } else if (it.swatches) {
              html += `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 12px 8px;">`;
              it.swatches.forEach(sw => {
                html += `<button class="color-swatch-btn" data-color="${sw.fill}" title="${sw.name}" style="width:24px;height:24px;border-radius:4px;background:${sw.fill};border:1px solid rgba(255,255,255,0.22);cursor:pointer;outline:none;transition:transform 0.12s;"></button>`;
              });
              html += `</div>`;
            } else if (it.customColor) {
              html += `<div style="display:flex;align-items:center;gap:10px;padding:6px 12px 10px;">
                <input type="color" class="color-custom-input" value="${it.value || '#60cdff'}" title="Custom color" />
                <span style="font-size:13px;color:var(--text-1)">Custom…</span>
              </div>`;
            } else {
              const activeCheck = it.active ? `<span style="color:#ffffff;font-size:11px;margin-left:auto;display:inline-flex;align-items:center;">${Icons.check}</span>` : '';
              html += `
                <button class="menu-item ${it.danger ? 'danger' : ''} ${it.active ? 'active' : ''}" data-idx="${idx}">
                  ${it.icon || ''}
                  <span style="flex:1">${it.label}</span>
                  ${activeCheck}
                </button>
              `;
            }
          });
          html += `</div>`;
          container.innerHTML = html;

          const menuEl = container.querySelector('.context-menu');
          // Place, then measure and pull back on-screen (never clipped).
          menuEl.style.left = Math.max(8, Math.min(x, window.innerWidth - 8)) + 'px';
          menuEl.style.top = Math.max(8, Math.min(y, window.innerHeight - 8)) + 'px';
          const mr = menuEl.getBoundingClientRect();
          if (mr.right > window.innerWidth - 8) {
            menuEl.style.left = Math.max(8, window.innerWidth - mr.width - 8) + 'px';
          }
          if (mr.bottom > window.innerHeight - 8) {
            menuEl.style.top = Math.max(8, window.innerHeight - mr.height - 8) + 'px';
          }
          menuEl.querySelectorAll('.menu-item').forEach(btn => {
            btn.onclick = (e) => {
              e.stopPropagation();
              const idx = parseInt(btn.dataset.idx, 10);
              const found = items[idx];
              container.innerHTML = '';
              if (found && found.action) found.action();
            };
          });

          menuEl.querySelectorAll('.color-swatch-btn').forEach(btn => {
            btn.onclick = (e) => {
              e.stopPropagation();
              const color = btn.dataset.color;
              const swatchItem = items.find(it => it.swatches);
              container.innerHTML = '';
              if (swatchItem && swatchItem.onSelect) swatchItem.onSelect(color);
            };
          });

          const customInput = menuEl.querySelector('.color-custom-input');
          if (customInput) {
            const customItem = items.find(it => it.customColor);
            customInput.addEventListener('input', (e) => {
              e.stopPropagation();
              if (customItem && customItem.onSelect) customItem.onSelect(e.target.value, true);
            });
            customInput.addEventListener('change', (e) => {
              e.stopPropagation();
              container.innerHTML = '';
              if (customItem && customItem.onSelect) customItem.onSelect(e.target.value, false);
            });
            customInput.addEventListener('mousedown', (e) => e.stopPropagation());
            customInput.addEventListener('click', (e) => e.stopPropagation());
          }

          const closeMenu = (e) => {
            if (!menuEl.contains(e.target)) {
              container.innerHTML = '';
              window.removeEventListener('mousedown', closeMenu);
            }
          };
          setTimeout(() => window.addEventListener('mousedown', closeMenu), 10);
        },

          if (TC) {
            document.getElementById('cap-min').onclick = () => TC.window.minimize();
            document.getElementById('cap-max').onclick = async () => {
              try { this.setMaxIcon(await TC.window.maximize()); } catch (e) {}
            };
            document.getElementById('cap-close').onclick = async () => {
              try { await this.flushSave(); await this.killAllPtys(); } catch (e) {}
              TC.window.close();
            };
            try { TC.window.onMaximize(v => this.setMaxIcon(v)); } catch (e) {}
          }

          // Home New Project (name → working folder → canvas)
          document.getElementById('btn-new-project-fab').onclick = async () => {
            await this.flushSave();
            const name = await new Promise((resolve) => {
              this.showModal(`
                <div class="modal-header">
                  <h3>New Canvas</h3>
                  <p>Name it, then pick the folder its terminals will start in.</p>
                </div>
                <div class="form-field">
                  <label class="form-label">Canvas name</label>
                  <input class="form-input" id="modal-inp-name" value="Untitled Canvas" />
                </div>
                <div class="modal-actions">
                  <button class="btn btn-secondary" id="modal-btn-cancel">Cancel</button>
                  <button class="btn btn-primary" id="modal-btn-next">Next</button>
                </div>
              `, (dialog) => {
                const inp = dialog.querySelector('#modal-inp-name');
                inp.focus(); inp.select();
                dialog.querySelector('#modal-btn-cancel').onclick = () => { this.closeModal(); resolve(null); };
                const go = () => {
                  const v = inp.value.trim() || 'Untitled Canvas';
                  this.closeModal();
                  resolve(v);
                };
                dialog.querySelector('#modal-btn-next').onclick = go;
                inp.addEventListener('keydown', (e) => {
                  if (e.key === 'Enter') go();
                  if (e.key === 'Escape') { this.closeModal(); resolve(null); }
                });
              });
            });
            if (name == null) return;
            let folder = null;
            if (TC) {
              // Automation hook (tests): preset folder, skip the native picker.
              if (typeof window.__tcTestDir === 'string' && window.__tcTestDir) {
                folder = window.__tcTestDir;
              } else {
                folder = await TC.projects.pickDir('Choose the working folder for this canvas');
                if (!folder) { this.toast('Pick a folder to create the canvas'); return; }
              }
            }
            const newProj = {
              id: uid(),
              name,
              description: 'Multi-terminal agent workspace',
              updatedAt: new Date().toISOString(),
              camera: { x: 80, y: 80, zoom: 1 },
              settings: { grid: Settings.data.gridDefault !== false, snap: Settings.data.snapDefault !== false, gridStyle: 'dots', gridSize: 24, defaultCwd: folder || undefined },
              zCounter: 2,
              terminals: [
                {
                  id: uid(),
                  name: 'PowerShell',
                  preset: 'powershell',
                  command: undefined,
                  args: [],
                  cwd: folder || undefined,
                  x: 100,
                  y: 100,
                  w: 560,
                  h: 360,
                  z: 1,
                  history: [{ type: 'sys', text: 'PowerShell ready.' }]
                }
              ],
              notes: [],
              wires: []
            };
            this.projects.unshift(newProj);
            if (TC) { try { await TC.projects.save(newProj.id, newProj); } catch (e) {} }
            else this.saveProjects();
            this.openProject(newProj.id);
            this.toast('New canvas created');
          };

          document.getElementById('project-filter').oninput = (e) => {
            this.projectFilter = e.target.value;
            this.renderHome();
          };

          // Canvas Navigation
          document.getElementById('btn-back-home').onclick = () => {
            this.showHome();
          };

          document.getElementById('canvas-proj-name').onchange = (e) => {
            if (this.currentProject) {
              this.currentProject.name = e.target.value.trim() || this.currentProject.name;
              this.scheduleSave();
            }
          };

          // Quick add (toolbar buttons removed; FAB + Ctrl+T use these).
          this.quickAddTerminal = () => {
            if (!this.currentProject) return;
            const center = this.screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
            this.createTerminalAt(center.x, center.y, Settings.data.defaultPreset);
          };
          this.quickAddNote = () => {
            if (!this.currentProject) return;
            const center = this.screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
            const count = (this.currentProject.notes || []).length;
            const n = {
              id: uid(),
              name: 'Workflow Note',
              shape: 'rounded',
              fill: '#1a1b21',
              text: '',
              x: Math.round(center.x - 140 + (count % 4) * 20),
              y: Math.round(center.y - 100 + (count % 4) * 20),
              w: 280,
              h: 180,
              z: ++this.currentProject.zCounter
            };
            this.currentProject.notes.push(n);
            this.renderCards();
            this.selectCard(n.id);
            this.scheduleSave();
            this.toast('Note added');
          };

          // Speed-dial FAB: + morphs to ×, fans out Notes / CLIs.
          document.getElementById('fab-plus-slot').innerHTML = Icons.plus;
          document.getElementById('fab-note-slot').innerHTML = Icons.note;
          document.getElementById('fab-cli-slot').innerHTML = Icons.terminal;
          const fabMain = document.getElementById('fab-main');
          const fabActions = document.getElementById('fab-actions');
          const fabClis = document.getElementById('fab-clis');
          const fabCliBtn = document.getElementById('fab-cli');
          const closeFab = () => {
            fabActions.classList.add('hidden');
            fabClis.classList.add('hidden');
            fabMain.classList.remove('open');
            fabCliBtn.classList.remove('active');
          };
          this._closeFab = closeFab;
          fabMain.onclick = (e) => {
            e.stopPropagation();
            const opening = fabActions.classList.contains('hidden');
            closeFab();
            if (opening && this.currentProject) {
              fabActions.classList.remove('hidden');
              fabMain.classList.add('open');
            }
          };
          document.getElementById('fab-note').onclick = (e) => {
            e.stopPropagation();
            closeFab();
            this.quickAddNote();
          };
          fabCliBtn.onclick = (e) => {
            e.stopPropagation();
            if (!this.currentProject) return;
            if (fabClis.classList.contains('hidden')) {
              fabClis.innerHTML = PRESETS.map(p => `<button class="fab-cli" type="button" data-preset="${p.id}" data-name="${esc(p.name)}" style="color:${p.color}">${(Icons.cli && Icons.cli[p.id]) || Icons.terminal}</button>`).join('');
              fabClis.querySelectorAll('.fab-cli').forEach(b => b.onclick = async (ev) => {
                ev.stopPropagation();
                const pid = b.dataset.preset;
                closeFab();
                if (!this.currentProject) return;
                const c = this.screenToWorld(window.innerWidth / 2, window.innerHeight / 2);
                await this.createTerminalAt(c.x, c.y, pid);
              });
              fabClis.classList.remove('hidden');
              fabCliBtn.classList.add('active');
            } else {
              fabClis.classList.add('hidden');
              fabCliBtn.classList.remove('active');
            }
          };

          // Grid Menu & Snap Toggles
          const btnGridMenu = document.getElementById('btn-grid-menu');
          if (btnGridMenu) {
            btnGridMenu.onclick = (e) => {
              e.stopPropagation();
              const r = btnGridMenu.getBoundingClientRect();
              this.showGridMenu(r.left - 10, r.bottom + 6);
            };
          }

          const btnSnap = document.getElementById('btn-toggle-snap');
          if (btnSnap) {
            btnSnap.onclick = (e) => {
              e.stopPropagation();
              const s = this.currentProject.settings = this.currentProject.settings || {};
              s.snap = !s.snap;
              this.updateGridButtonState();
              this.scheduleSave();
              this.toast(s.snap ? 'Snap to grid enabled' : 'Snap disabled');
            };
          }

          // Wire mode lives on the zoom rail now.
          const btnWireRail = document.getElementById('btn-rzwire');
          this.setWireMode = (on, silent) => {
            document.body.classList.toggle('wire-mode-active', !!on);
            const active = document.body.classList.contains('wire-mode-active');
            if (btnWireRail) btnWireRail.classList.toggle('active', active);
            if (!silent) this.toast(active ? 'Wiring mode enabled — drag between ports' : 'Normal mode');
          };

          // Zoom rail (right edge): + / % / − / fit / wire
          const zoomCenter = () => {
            const r = document.getElementById('canvas-viewport').getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
          };
          document.getElementById('btn-rzin').onclick = () => {
            const c = zoomCenter();
            this.zoomAt(c.x, c.y, 1.18);
          };
          document.getElementById('btn-rzout').onclick = () => {
            const c = zoomCenter();
            this.zoomAt(c.x, c.y, 1 / 1.18);
          };
          document.getElementById('btn-rzfit').onclick = () => {
            this.fitAll();
          };
          document.getElementById('rzfit-icon-slot').innerHTML = Icons.fit;
          document.getElementById('rzwire-icon-slot').innerHTML = Icons.wire;
          document.getElementById('zoom-rail-val').onclick = () => {
            if (!this.currentProject) return;
            this.currentProject.camera.zoom = 1;
            this.applyCamera();
            this.scheduleSave();
          };
          document.getElementById('btn-rzwire').onclick = (e) => {
            e.stopPropagation();
            this.setWireMode(!document.body.classList.contains('wire-mode-active'));
          };

          const btnMinimapFit = document.getElementById('btn-minimap-fit');
          if (btnMinimapFit) {
            btnMinimapFit.onclick = (e) => {
              e.stopPropagation();
              this.fitAll();
            };
          }

          // Viewport Panning & Zoom
          const viewport = document.getElementById('canvas-viewport');

          viewport.onmousedown = (e) => {
            if (e.target.closest('.canvas-card, .wire-hitbox, .canvas-minimap-container, .wire-del-btn, .wire-flyout, .canvas-fab, .zoom-rail')) return;
            if (e.button === 1) {
              // Middle-drag pans the canvas.
              e.preventDefault();
              this.isPanning = true;
              this.panMoved = false;
              this.panStart = {
                x: e.clientX - this.currentProject.camera.x,
                y: e.clientY - this.currentProject.camera.y
              };
              this.panClientStart = { x: e.clientX, y: e.clientY };
              viewport.classList.add('panning');
              return;
            }
            if (e.button !== 0) {
              if (this.selectedId || this.selectedIds.length) {
                this.selectedId = null;
                this.selectedIds = [];
                this.renderCards();
                this.drawWires();
                this.updateStatusBar();
              }
              return;
            }
            // Left-drag on empty canvas: Windows-style rubber-band select.
            this._marquee = {
              sx: e.clientX, sy: e.clientY, moved: false,
              additive: !!(e.ctrlKey || e.metaKey),
              base: [...(this.selectedIds || [])]
            };
          };

          this._finishMarquee = (clearOnTap) => {
            const m = this._marquee;
            this._marquee = null;
            const box = document.getElementById('marquee-box');
            if (box) box.classList.add('hidden');
            if (m && !m.moved && clearOnTap !== false && !m.additive) {
              if (this.selectedId || (this.selectedIds || []).length) {
                this.selectedId = null;
                this.selectedIds = [];
                this.renderCards();
                this.drawWires();
                this.updateStatusBar();
              }
            }
          };

          this._marqueeSelect = (x0, y0, x1, y1) => {
            if (!this.currentProject) return;
            const a = this.screenToWorld(x0, y0), b = this.screenToWorld(x1, y1);
            const rx0 = Math.min(a.x, b.x), rx1 = Math.max(a.x, b.x);
            const ry0 = Math.min(a.y, b.y), ry1 = Math.max(a.y, b.y);
            const hits = [];
            for (const t of (this.currentProject.terminals || [])) {
              if (t.x < rx1 && t.x + t.w > rx0 && t.y < ry1 && t.y + t.h > ry0) hits.push(t.id);
            }
            for (const n of (this.currentProject.notes || [])) {
              if (n.x < rx1 && n.x + n.w > rx0 && n.y < ry1 && n.y + n.h > ry0) hits.push(n.id);
            }
            const m = this._marquee;
            const ids = (m && m.additive) ? [...m.base] : [];
            for (const hid of hits) if (!ids.includes(hid)) ids.push(hid);
            this.selectedIds = ids;
            this.selectedId = ids.length ? ids[ids.length - 1] : null;
            this.renderCards();
            this.drawWires();
          };

          let panRaf = 0;
          let panLatest = null;
          window.onmousemove = (e) => {
            if (this._marquee) {
              const m = this._marquee;
              if (e.buttons === 0) { this._finishMarquee(true); return; }
              if (!m.moved && Math.hypot(e.clientX - m.sx, e.clientY - m.sy) <= 4) return;
              m.moved = true;
              const vp = viewport.getBoundingClientRect();
              const bx0 = Math.min(m.sx, e.clientX), bx1 = Math.max(m.sx, e.clientX);
              const by0 = Math.min(m.sy, e.clientY), by1 = Math.max(m.sy, e.clientY);
              const box = document.getElementById('marquee-box');
              if (box) {
                box.style.left = (bx0 - vp.left) + 'px';
                box.style.top = (by0 - vp.top) + 'px';
                box.style.width = Math.max(0, bx1 - bx0) + 'px';
                box.style.height = Math.max(0, by1 - by0) + 'px';
                box.classList.remove('hidden');
              }
              this._marqueeSelect(bx0, by0, bx1, by1);
              return;
            }
            if (this.isPanning && e.buttons === 0) {
              this.isPanning = false;
              viewport.classList.remove('panning');
              if (this.panMoved) {
                this.panMoved = false;
                this.scheduleSave();
              }
              return;
            }
            if (this.isPanning && this.currentProject) {
              panLatest = { x: e.clientX, y: e.clientY };
              if (panRaf) return;
              panRaf = requestAnimationFrame(() => {
                panRaf = 0;
                const cur = panLatest;
                panLatest = null;
                if (!cur || !this.isPanning || !this.currentProject) return;
                if (this.panClientStart && Math.hypot(cur.x - this.panClientStart.x, cur.y - this.panClientStart.y) > 4) {
                  this.panMoved = true;
                }
                this.currentProject.camera.x = quantizePx(cur.x - this.panStart.x);
                this.currentProject.camera.y = quantizePx(cur.y - this.panStart.y);
                this.applyCamera();
              });
            }
          };

          window.onmouseup = () => {
            if (this._marquee) this._finishMarquee(true);
            if (this.isPanning) {
              this.isPanning = false;
              viewport.classList.remove('panning');
              if (this.panMoved) {
                this.scheduleSave();
              }
              this.panMoved = false;
            }
          };

          viewport.oncontextmenu = (e) => {
            if (e.target.closest('.canvas-card, .canvas-minimap-container, .wire-del-btn, .wire-hitbox, .wire-flyout, .canvas-fab')) return;
            e.preventDefault();
            const pt = this.screenToWorld(e.clientX, e.clientY);
            this.showCanvasContextMenu(e.clientX, e.clientY, pt);
          };

          viewport.onwheel = (e) => {
            if (!this.currentProject) return;
            const t = e.target;
            const overTerm = t && t.closest && t.closest('.xterm-viewport');
            const overNote = !overTerm && t && t.closest && t.closest('.note-body');
            // Plain scroll belongs to the terminal / note underneath so
            // scrollback keeps working; Ctrl+scroll (or scroll elsewhere) zooms.
            if ((overTerm || overNote) && !e.ctrlKey && !e.metaKey) return;
            e.preventDefault();
            const factor = e.deltaY > 0 ? 0.92 : 1.08;
            this.zoomAt(e.clientX, e.clientY, factor);
          };

          // Double click canvas to create a note
          viewport.ondblclick = (e) => {
            if (e.target.closest('.canvas-card, .canvas-minimap-container')) return;
            const pt = this.screenToWorld(e.clientX, e.clientY);
            const n = {
              id: uid(),
              name: 'Quick Note',
              shape: 'rounded',
              fill: '#2e3038',
              text: '',
              x: Math.round(pt.x - 140),
              y: Math.round(pt.y - 90),
              w: 280,
              h: 180,
              z: ++this.currentProject.zCounter
            };
            this.currentProject.notes.push(n);
            this.renderCards();
            this.selectCard(n.id);
            this.scheduleSave();
          };

          const globalSearch = document.getElementById('global-search');
          if (globalSearch) {
            globalSearch.oninput = (e) => {
              this.searchQuery = e.target.value;
              this.renderCards();
              this.drawWires();
            };
          }

          // Keyboard Shortcuts
          window.onkeydown = (e) => {
            if (['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.target.isContentEditable) {
              return;
            }

            if (e.key === 'Delete' || e.key === 'Backspace') {
              if (this.selectedId) {
                if (this.selectedId.startsWith('wire:')) {
                  this.deleteWire(this.selectedId.slice(5));
                } else if (this.selectedIds.length > 1) {
                  this.deleteSelectedCards();
                } else {
                  this.deleteCard(this.selectedId);
                }
              }
            } else if (e.key === 'Escape') {
              try { this._closeFab && this._closeFab(); } catch (err) {}
              this.selectedId = null;
              this.selectedIds = [];
              this.renderCards();
              this.drawWires();
              this.updateStatusBar();
            } else if (e.ctrlKey && e.key.toLowerCase() === 't') {
              e.preventDefault();
              if (this.view === 'canvas') this.quickAddTerminal();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
              e.preventDefault();
              if (this.view === 'canvas') {
                const inp = document.getElementById('global-search');
                if (inp) { inp.focus(); inp.select(); }
              } else {
                const f = document.getElementById('project-filter');
                if (f) { f.focus(); f.select(); }
              }
            } else if (e.ctrlKey && e.key.toLowerCase() === 'f') {
              e.preventDefault();
              const inp = document.getElementById('global-search');
              if (inp) {
                inp.focus();
                inp.select();
              }
            }
          };

          const btnShortcutsB = document.getElementById('btn-shortcuts');
          if (btnShortcutsB) btnShortcutsB.onclick = () => this.openShortcuts();
            const btnSettings = document.getElementById('btn-settings');
            if (btnSettings) btnSettings.onclick = () => this.openSettings();

            // Sidebar: version + updates
            try {
              const verEl = document.getElementById('app-version');
              const done = (v) => { if (verEl) verEl.textContent = 'Canval v' + (v || '1.0.0'); };
              if (TC && TC.app) TC.app.version().then(done).catch(() => done(null));
              else done(null);
            } catch (_) {}
            const updBtn = document.getElementById('btn-check-updates');
            const updSt = document.getElementById('update-status');
            const updMsg = (s) => {
              if (!updSt || !s) return;
              updSt.classList.remove('hidden');
              if (updBtn) updBtn.classList.add('hidden');
              const v = s.version ? ' v' + s.version : '';
              if (s.state === 'checking') updSt.textContent = 'Checking for updates…';
              else if (s.state === 'current') updSt.textContent = 'Canval is up to date';
              else if (s.state === 'available') updSt.textContent = 'Update' + v + ' found — downloading…';
              else if (s.state === 'downloading') updSt.textContent = 'Downloading update… ' + (s.percent || 0) + '%';
              else if (s.state === 'ready') updSt.textContent = 'Update' + v + ' ready — click to restart';
              else if (s.state === 'dev') updSt.textContent = 'Dev build (v' + (s.version || '?') + ') — updates ship with releases';
              else updSt.textContent = 'Update check failed' + (s.message ? ': ' + s.message : '');
              updSt.onclick = (s.state === 'ready' && TC && TC.updater)
                ? () => { try { TC.updater.quitInstall(); } catch (_) {} }
                : null;
            };
            if (updBtn) updBtn.onclick = async () => {
              updBtn.disabled = true;
              try {
                if (TC && TC.updater) updMsg(await TC.updater.check());
                else updMsg({ state: 'dev' });
              } catch (_) { updMsg({ state: 'error' }); }
              updBtn.disabled = false;
            };
            try { if (TC && TC.updater && TC.updater.onStatus) TC.updater.onStatus(updMsg); } catch (_) {}

          window.onresize = () => {
            if (this.view === 'canvas') {
              this.updateMinimap();
            }
          };
        }
      };

      // Bootstrap applet
      window.addEventListener('DOMContentLoaded', () => {
        App.init();
      });
      window.TCApp = App; // diagnostics + power-user automation hook
    </script>
  </body>
</html>
