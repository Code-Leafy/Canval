          });
        },

        async duplicateProject(p) {
          const copy = JSON.parse(JSON.stringify(p));
          copy.id = uid();
          copy.name = p.name + ' (Copy)';
          copy.updatedAt = new Date().toISOString();
          this.projects.unshift(copy);
          if (TC) { try { await TC.projects.save(copy.id, copy); } catch (e) {} }
          else this.saveProjects();
          this.renderHome();
          this.toast('Canvas duplicated');
        },

        async deleteProject(p) {
          if (this.projects.length <= 1) {
            this.toast('Cannot delete the only canvas.');
            return;
          }
          if (Settings.data.confirmDelete !== false) {
            const ok = await this.confirmDlg(`Delete “${p.name}”?`, 'Its terminals will be closed. This cannot be undone.');
            if (!ok) return;
          }
          if (TC) { try { await TC.projects.delete(p.id); } catch (e) {} }
          this.projects = this.projects.filter(x => x.id !== p.id);
          if (!TC) this.saveProjects();
          this.renderHome();
          this.toast('Canvas deleted');
        },

        /* --- Canvas Cards & Engine --- */
        findCard(id) {
          if (!this.currentProject) return null;
          return (this.currentProject.terminals || []).find(t => t.id === id) ||
                 (this.currentProject.notes || []).find(n => n.id === id);
        },

        renderCards() {
          const p = this.currentProject;
          if (!p) return;
          const world = document.getElementById('canvas-world');

          // Keep existing card DOM if present, otherwise build it
          const currentIds = new Set([...p.terminals.map(t => t.id), ...p.notes.map(n => n.id)]);
          world.querySelectorAll('.canvas-card').forEach(el => {
            if (!currentIds.has(el.dataset.id)) el.remove();
          });

          // Render terminals
          p.terminals.forEach(t => this.renderTerminalCard(t, world));
          // Render notes
          p.notes.forEach(n => this.renderNoteCard(n, world));

          this.updateStatusBar();
          this.updateMinimap();
          this.updateSearchCount();
        },

        updateSearchCount() {
          const el = document.getElementById('global-search-count');
          if (!el) return;
          const q = (this.searchQuery || '').trim();
          if (!q || this.view !== 'canvas') { el.classList.add('hidden'); return; }
          const total = document.querySelectorAll('#canvas-world .canvas-card').length;
          const vis = document.querySelectorAll('#canvas-world .canvas-card:not(.dimmed)').length;
          el.textContent = `${vis}/${total}`;
          el.classList.remove('hidden');
        },

        renderTerminalCard(t, world) {
          let el = world.querySelector(`.canvas-card[data-id="${t.id}"]`);
          // Self-heal cards built by older templates (missing edge handles/host).
          if (el && (!el.querySelector('.rz') || !el.querySelector('.xterm-host'))) {
            this.killPty(t.id);
            el.remove();
            el = null;
          }
          const preset = PRESETS.find(pr => pr.id === t.preset) || PRESETS[0];

          if (!el) {
            el = document.createElement('div');
            el.className = 'canvas-card card-terminal';
            el.dataset.id = t.id;
            el.dataset.type = 'terminal';
            const bodyHtml = DEMO ? `
              <div class="terminal-container">
                <div class="terminal-scroll" id="term-scroll-${t.id}"></div>
                <div class="terminal-input-row">
                  <span class="terminal-prompt" id="term-prompt-${t.id}">${preset.prompt}</span>
                  <input class="terminal-input" id="term-input-${t.id}" spellcheck="false" autocomplete="off" placeholder="Type a command or 'help'..." />
                </div>
              </div>` : `
              <div class="xterm-host" id="xterm-host-${t.id}"></div>`;
            el.innerHTML = `
              <div class="card-header">
                <span class="cli-badge-dot" style="background:${preset.color};color:${preset.color}"></span>
                <input class="card-title-input" spellcheck="false" value="${esc(t.name)}" />
                <span class="card-cli-pill" style="color:${preset.color}">${esc(preset.name)}</span>
                <button class="card-icon-btn btn-card-menu" type="button" data-tip="Card options" data-tip-pos="top">${Icons.more}</button>
                <button class="card-icon-btn close btn-card-close" type="button" data-tip="Close terminal" data-tip-pos="top">${Icons.close}</button>
              </div>
              ${bodyHtml}
              <!-- Wire Ports -->
              <div class="card-port port-n" data-port="n" data-tip="Wire port" data-tip-pos="top"></div>
              <div class="card-port port-s" data-port="s" data-tip="Wire port" data-tip-pos="top"></div>
              <div class="card-port port-w" data-port="w" data-tip="Wire port" data-tip-pos="top"></div>
              <div class="card-port port-e" data-port="e" data-tip="Wire port" data-tip-pos="top"></div>
              <div class="rz rz-n" data-rz="n"></div>
              <div class="rz rz-s" data-rz="s"></div>
              <div class="rz rz-e" data-rz="e"></div>
              <div class="rz rz-w" data-rz="w"></div>
                                                                    `;
            world.appendChild(el);
            this.bindCardEvents(el, t);
            this.bindTerminalIO(t);
            // Custom terminals attach once a command is configured
            // (promptCustomCommand → respawnPTY), not with a placeholder shell.
            if (!DEMO && !(t.preset === 'custom' && !t.command)) this.attachPTY(t);
          }

          // Update geometry & styles
          el.style.left = `${t.x}px`;
          el.style.top = `${t.y}px`;
          el.style.width = `${t.w}px`;
          el.style.height = `${t.h}px`;
          el.style.zIndex = t.z || 1;
          el.classList.toggle('selected', this.isSelected(t.id));

          const q = this.searchQuery.toLowerCase().trim();
          const match = !q || t.name.toLowerCase().includes(q) || (t.history || []).some(h => h.text.toLowerCase().includes(q));
          el.classList.toggle('dimmed', !match);
        },

        renderNoteCard(n, world) {
          let el = world.querySelector(`.canvas-card[data-id="${n.id}"]`);
          // Self-heal cards built by older templates (missing edge handles).
          if (el && !el.querySelector('.rz')) {
            el.remove();
            el = null;
          }
          if (!el) {
            el = document.createElement('div');
            el.className = 'canvas-card card-note';
            el.dataset.id = n.id;
            el.dataset.type = 'note';
            el.innerHTML = `
              <div class="card-header">
                <span class="cli-badge-dot" style="background:#eab308;color:#eab308"></span>
                <input class="card-title-input" spellcheck="false" value="${esc(n.name)}" />
                <button class="card-icon-btn btn-card-menu" type="button" data-tip="Note options" data-tip-pos="top">${Icons.more}</button>
                <button class="card-icon-btn close btn-card-close" type="button" data-tip="Delete note" data-tip-pos="top">${Icons.close}</button>
              </div>
              <div class="note-body" contenteditable="true" spellcheck="false"></div>
              <!-- Wire Ports -->
              <div class="card-port port-n" data-port="n" data-tip="Wire port" data-tip-pos="top"></div>
              <div class="card-port port-s" data-port="s" data-tip="Wire port" data-tip-pos="top"></div>
              <div class="card-port port-w" data-port="w" data-tip="Wire port" data-tip-pos="top"></div>
              <div class="card-port port-e" data-port="e" data-tip="Wire port" data-tip-pos="top"></div>
              <div class="rz rz-n" data-rz="n"></div>
              <div class="rz rz-s" data-rz="s"></div>
              <div class="rz rz-e" data-rz="e"></div>
              <div class="rz rz-w" data-rz="w"></div>
                                                                    `;
            world.appendChild(el);
            this.bindCardEvents(el, n);

            const body = el.querySelector('.note-body');
            body.innerText = n.text || '';
            body.oninput = () => {
              n.text = body.innerText;
              this.scheduleSave();
            };
          }

          // Notes are always rounded cards now (legacy shapes normalize).
          if (n.shape && n.shape !== 'rounded') n.shape = 'rounded';
          ['rounded', 'sticky', 'diamond', 'triangle', 'hexagon', 'capsule', 'slab', 'beveled'].forEach(s => el.classList.remove('card-shape-' + s));
          el.classList.remove('shape-geometric');
          el.classList.add('card-shape-rounded');

          const fill = n.fill || 'rgba(38, 38, 44, 0.85)';
          const isLight = isColorLight(fill);
          el.classList.toggle('is-light', isLight);
          el.classList.toggle('is-dark', !isLight);

          el.style.setProperty('--note-bg', fill);
          const inkColor = isLight ? '#000000' : '#f3f4f6';
          const placeholderColor = isLight ? 'rgba(0, 0, 0, 0.45)' : 'rgba(255, 255, 255, 0.35)';
          const headerBorder = isLight ? 'rgba(0, 0, 0, 0.08)' : 'rgba(255, 255, 255, 0.06)';

          el.style.setProperty('--note-ink', inkColor);
          el.style.setProperty('--note-placeholder', placeholderColor);
          el.style.setProperty('--note-header-border', headerBorder);

          const titleEl = el.querySelector('.card-title-input');
          const bodyEl = el.querySelector('.note-body');
          if (titleEl) titleEl.style.color = inkColor;
          if (bodyEl) bodyEl.style.color = inkColor;
          el.querySelectorAll('.card-icon-btn').forEach(btn => {
            btn.style.color = inkColor;
          });

          el.style.left = `${n.x}px`;
          el.style.top = `${n.y}px`;
          el.style.width = `${n.w}px`;
          el.style.height = `${n.h}px`;
          el.style.zIndex = n.z || 1;
          el.classList.toggle('selected', this.isSelected(n.id));

          const q = this.searchQuery.toLowerCase().trim();
          const match = !q || n.name.toLowerCase().includes(q) || (n.text || '').toLowerCase().includes(q);
          el.classList.toggle('dimmed', !match);
        },

        bindCardEvents(el, item) {
          const header = el.querySelector('.card-header');
          const titleInput = el.querySelector('.card-title-input');
          const btnMenu = el.querySelector('.btn-card-menu');
          const btnClose = el.querySelector('.btn-card-close');

          titleInput.oninput = () => {
            item.name = titleInput.value;
            this.scheduleSave();
          };
          // Rename via double-click (single click drags the card).
          titleInput.readOnly = true;
          header.addEventListener('dblclick', (e) => {
            if (e.target.closest('button')) return;
            e.stopPropagation();
            titleInput.readOnly = false;
            titleInput.focus();
            titleInput.select();
          });
          titleInput.addEventListener('blur', () => { titleInput.readOnly = true; });
          titleInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') titleInput.blur();
            e.stopPropagation();
          });

          header.onmousedown = (e) => {
            if (e.target.closest('input, button')) return;
            if (!this.isSelected(item.id)) {
              this.selectCard(item.id);
            } else {
              this.currentProject.zCounter = (this.currentProject.zCounter || 10) + 1;
              item.z = this.currentProject.zCounter;
              el.style.zIndex = item.z;
              this.selectedId = item.id;
            }
            const startX = e.clientX;
            const startY = e.clientY;
            const group = this.selectedIds.length > 1
              ? this.selectedIds.map(gid => this.findCard(gid)).filter(Boolean)
              : [item];
            const origs = new Map(group.map(g => [g.id, { x: g.x, y: g.y }]));
            const leader = origs.get(item.id);
            const zoom = this.currentProject.camera.zoom;
            const snap = this.currentProject.settings.snap;
            let hasMoved = false;
            let rafId = 0;
            let latest = null;

            const stepMove = (cx, cy) => {
              const dx = (cx - startX) / zoom;
              const dy = (cy - startY) / zoom;
              if (Math.abs(cx - startX) > 3 || Math.abs(cy - startY) > 3) {
                hasMoved = true;
              }
              let nx = leader.x + dx;
              let ny = leader.y + dy;
              if (snap) {
                const gSize = (this.currentProject?.settings?.gridSize) || 24;
                nx = Math.round(nx / gSize) * gSize;
                ny = Math.round(ny / gSize) * gSize;
              } else {
                nx = quantizePx(nx);
                ny = quantizePx(ny);
              }
              const ddx = nx - leader.x;
              const ddy = ny - leader.y;
              group.forEach(g => {
                const oo = origs.get(g.id);
                if (g === item) { g.x = nx; g.y = ny; }
                else if (snap) { g.x = oo.x + ddx; g.y = oo.y + ddy; }
                else { g.x = quantizePx(oo.x + ddx); g.y = quantizePx(oo.y + ddy); }
              });
              this.renderCards();
              this.drawWires();
              this.updateMinimap();
            };

            const onMove = (ev) => {
              // Release outside the window fires no mouseup: end the gesture
              // instead of sticking to the cursor.
              if (ev.buttons === 0) { onUp(); return; }
              latest = { x: ev.clientX, y: ev.clientY };
              if (rafId) return;
              rafId = requestAnimationFrame(() => {
                rafId = 0;
                const cur = latest;
                latest = null;
                if (cur) stepMove(cur.x, cur.y);
              });
            };

            const onUp = () => {
              if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
              if (latest) { const cur = latest; latest = null; stepMove(cur.x, cur.y); }
              window.removeEventListener('mousemove', onMove);
              window.removeEventListener('mouseup', onUp);
              if (hasMoved) {
                this.persistProject(this.currentProject);
              }
              this.updateMinimap();
            };

            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
          };

          // Edge resize (N/S/E/W)
          el.querySelectorAll('.rz').forEach(handle => {
            handle.onmousedown = (e) => {
              e.stopPropagation();
              e.preventDefault();
              const edge = handle.dataset.rz;
              const startX = e.clientX;
              const startY = e.clientY;
              const oX = item.x, oY = item.y, oW = item.w, oH = item.h;
              const zoom = this.currentProject.camera.zoom;
              let hasResized = false;
              let rafId = 0;
              let latest = null;

              const stepResize = (cx, cy) => {
                const dw = (cx - startX) / zoom;
                const dh = (cy - startY) / zoom;
                if (Math.abs(cx - startX) > 3 || Math.abs(cy - startY) > 3) {
                  hasResized = true;
                }
                const goE = edge.includes('e'), goS = edge.includes('s');
                const goW = edge.includes('w'), goN = edge.includes('n');
                let nx = oX, ny = oY, nw = oW, nh = oH;
                if (goE) nw = Math.max(200, oW + dw);
                if (goS) nh = Math.max(120, oH + dh);
                if (goW) {
                  nw = Math.max(200, oW - dw);
                  nx = oX + (oW - nw);
                }
                if (goN) {
                  nh = Math.max(120, oH - dh);
                  ny = oY + (oH - nh);
                }
                item.x = quantizePx(nx);
                item.y = quantizePx(ny);
                item.w = quantizePx(nw);
                item.h = quantizePx(nh);
                el.style.left = `${item.x}px`;
                el.style.top = `${item.y}px`;
                el.style.width = `${item.w}px`;
                el.style.height = `${item.h}px`;
                const prec = this.ptyMap.get(item.id);
                if (prec && prec.fit) { try { prec.fit.fit(); } catch (err) {} }
                this.requestPtyResize(prec, item.id);
                this.drawWires();
                this.updateMinimap();
              };

              const onMove = (ev) => {
                if (ev.buttons === 0) { onUp(); return; }
                latest = { x: ev.clientX, y: ev.clientY };
                if (rafId) return;
                rafId = requestAnimationFrame(() => {
                  rafId = 0;
                  const cur = latest;
                  latest = null;
                  if (cur) stepResize(cur.x, cur.y);
                });
              };

              const onUp = () => {
                if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
                if (latest) { const cur = latest; latest = null; stepResize(cur.x, cur.y); }
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                if (hasResized) {
                  this.persistProject(this.currentProject);
                  // A resized shell reflows only if the session restarts, so
                  // TUIs match the new resolution immediately.
                  if (item.preset && this.ptyMap.has(item.id)) this.respawnPTY(item.id);
                }
                this.updateMinimap();
              };

              window.addEventListener('mousemove', onMove);
              window.addEventListener('mouseup', onUp);
            };
          });

          btnMenu.onclick = (e) => {
            e.stopPropagation();
            const r = btnMenu.getBoundingClientRect();
            this.showCardContextMenu(r.left - 120, r.bottom + 4, item);
          };

          btnClose.onclick = (e) => {
            e.stopPropagation();
            this.deleteCard(item.id);
          };

          // Context menu (Right Click) on the Card
          el.oncontextmenu = (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!this.isSelected(item.id)) this.selectCard(item.id);
            this.showCardContextMenu(e.clientX, e.clientY, item);
          };

          el.onmousedown = (e) => {
            if (e.ctrlKey || e.metaKey) {
              e.stopPropagation();
              this.selectCard(item.id, true);
            } else if (!this.isSelected(item.id)) {
              this.selectCard(item.id);
            }
            // Focus the live shell so TUI mouse/keyboard input lands there.
            if (!e.target.closest('input, button, .card-port, .rz')) {
              const rec = this.ptyMap.get(item.id);
              if (rec && rec.term) { try { rec.term.focus(); } catch (_) {} }
            }
          };

          // Port wiring listeners
          el.querySelectorAll('.card-port').forEach(port => {
            port.onmousedown = (e) => {
              e.stopPropagation();
              this.startWireDraft(item.id, port.dataset.port, e);
            };
          });
        },

        /* --- Terminal Interactive CLI IO Engine --- */
        bindTerminalIO(t) {
          if (!DEMO) return; // desktop uses a real PTY (attachPTY) instead of the simulated console
          const scroll = document.getElementById(`term-scroll-${t.id}`);
          const input = document.getElementById(`term-input-${t.id}`);
          if (!scroll || !input) return;

          // Render existing history
          scroll.innerHTML = '';
          (t.history || []).forEach(h => {
            const line = document.createElement('div');
            line.className = `terminal-line ${h.type || 'sys'}`;
            line.textContent = h.text;
            scroll.appendChild(line);
          });
          scroll.scrollTop = scroll.scrollHeight;

          let historyIdx = -1;
          const userCmds = [];

          input.onkeydown = (e) => {
            if (e.key === 'Enter') {
              const cmd = input.value.trim();
              if (!cmd) return;
              input.value = '';
              userCmds.push(cmd);
              historyIdx = userCmds.length;
              this.handleCommand(t, cmd);
            } else if (e.key === 'ArrowUp') {
              if (historyIdx > 0) {
                historyIdx--;
                input.value = userCmds[historyIdx] || '';
              }
            } else if (e.key === 'ArrowDown') {
              if (historyIdx < userCmds.length - 1) {
                historyIdx++;
                input.value = userCmds[historyIdx] || '';
              } else {
                historyIdx = userCmds.length;
                input.value = '';
              }
            }
          };
        },

        /* --- Real PTY engine (desktop shell) --- */
        // Resize requests are de-duplicated and debounced: stray SIGWINCH
        // storms (notably around spawn) can wedge backend sessions.
        requestPtyResize(rec, id) {
          if (!rec || !rec.term || !TC) return;
          const cols = Math.max(2, rec.term.cols | 0);
          const rows = Math.max(1, rec.term.rows | 0);
          if (rec._sentCols === cols && rec._sentRows === rows) return;
          rec._rzCols = cols;
          rec._rzRows = rows;
          if (rec._rzT) return;
          rec._rzT = setTimeout(() => {
            rec._rzT = 0;
            if (!rec.term) return;
            if (rec._sentCols === rec._rzCols && rec._sentRows === rec._rzRows) return;
            rec._sentCols = rec._rzCols;
            rec._sentRows = rec._rzRows;
            try { TC.pty.resize(id, rec._sentCols, rec._sentRows); } catch (e) {}
          }, 220);
        },

        async killAllPtys() {
          for (const [id, rec] of this.ptyMap) {
            try { rec._rzT && clearTimeout(rec._rzT); } catch (e) {}
            try { rec.ro && rec.ro.disconnect(); } catch (e) {}
            try { rec.term.dispose(); } catch (e) {}
            if (TC) { try { await TC.pty.kill(id); } catch (e) {} }
          }
          this.ptyMap.clear();
        },

        async killPty(id) {
          const rec = this.ptyMap.get(id);
          if (!rec) return;
          try { rec._rzT && clearTimeout(rec._rzT); } catch (e) {}
          try { rec.ro && rec.ro.disconnect(); } catch (e) {}
          try { rec.term.dispose(); } catch (e) {}
          this.ptyMap.delete(id);
          if (TC) { try { await TC.pty.kill(id); } catch (e) {} }
        },

        snapshotScrollback() {
          if (DEMO || !this.currentProject) return;
          for (const t of (this.currentProject.terminals || [])) {
            const rec = this.ptyMap.get(t.id);
            if (!rec) continue;
            try {
              const buf = rec.term.buffer.active;
              const lines = [];
              const n = Math.min(200, buf.length);
              for (let i = Math.max(0, buf.length - n); i < buf.length; i++) {
                const line = buf.getLine(i);
                if (line) lines.push(line.translateToString(true));
              }
              while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
              t.history = lines.map(text => ({ type: 'sys', text }));
            } catch (e) {}
          }
        },

        async flushSave() {
          if (this._saveTimer) { clearTimeout(this._saveTimer); this._saveTimer = 0; }
          if (TC && this.currentProject) {
            try {
              this.snapshotScrollback();
              this.currentProject.updatedAt = new Date().toISOString();
              await TC.projects.save(this.currentProject.id, this.currentProject);
            } catch (e) {}
          }
        },

        async attachAllPtys() {
          if (DEMO || !this.currentProject) return;
          for (const t of (this.currentProject.terminals || [])) await this.attachPTY(t);
        },

        async attachPTY(t) {
          if (DEMO || !TC) return;
          if (!XTerminal) {
            if (!this._xtermWarned) { this._xtermWarned = true; this.toast('Terminal engine failed to load — reinstall and restart'); }
            return;
          }
          if (this.ptyMap.has(t.id)) return;
          const myGen = (t.__attachGen = (t.__attachGen || 0) + 1);
          const host = document.getElementById('xterm-host-' + t.id);
          if (!host) return;
          const term = new XTerminal({
            fontFamily: termFontStack(),
            fontSize: Settings.data.fontSize || 14,
            fontWeight: termWeight(),
            fontWeightBold: 700,
            lineHeight: 1.25,
            cursorStyle: Settings.data.cursorStyle || 'block',
            minimumContrastRatio: Settings.data.boostContrast !== false ? 4.5 : 1,
            allowTransparency: false,
            theme: { background: '#0c0c0c', foreground: '#cccccc', cursor: '#ffffff', selectionBackground: '#264f78' },
            cursorBlink: Settings.data.cursorBlink !== false,
            scrollback: (Number.isFinite(parseInt(Settings.data.scrollback, 10)) ? Math.max(0, Math.min(10000, parseInt(Settings.data.scrollback, 10))) : 3000)
          });
          let fit = null;
          if (XFitAddon) { fit = new XFitAddon(); term.loadAddon(fit); }
          term.open(host);
          try { fit && fit.fit(); } catch (e) {}
          const rec = { term, fit, ro: null, webgl: null, ptyId: t.id };
          this.ptyMap.set(t.id, rec);
          const renderMode = Settings.data.renderer || 'auto';
          const gpuCount = [...this.ptyMap.values()].filter(r => r.webgl).length;
          if (renderMode !== 'dom' && XWebglAddon && gpuCount < 8) {
            try {
              const gl = new XWebglAddon();
              term.loadAddon(gl);
              rec.webgl = gl;
            } catch (e) {
              rec.webgl = null;
              if (renderMode === 'webgl') { try { term.writeln('\x1b[33mGPU renderer unavailable on this machine — using compatibility mode\x1b[0m'); } catch (_) {} }
            }
          } else if (renderMode !== 'dom' && gpuCount >= 8 && !this._gpuCapWarned) {
            this._gpuCapWarned = true;
            this.toast('Many terminals open — extras use compatibility mode');
          }
          try { (t.history || []).forEach(h => { if (h && h.text) term.writeln(h.text); }); } catch (e) {}
          term.onData(d => { try { TC.pty.write(t.id, d); } catch (e) {} });
          // Selection-aware copy/paste: Ctrl+C copies when text is selected
          // (otherwise it goes to the shell as SIGINT), Ctrl+V / Shift+Ins paste.
          try {
            term.attachCustomKeyEventHandler((kev) => {
              if (kev.type !== 'keydown') return true;
              const mod = kev.ctrlKey || kev.metaKey;
              if (mod && !kev.shiftKey && !kev.altKey && kev.code === 'KeyC') {
                let sel = '';
                try { sel = term.getSelection(); } catch (e) {}
                if (sel) {
                  kev.preventDefault();
                  TC.clip.copy(sel).then(() => { try { term.clearSelection(); } catch (e) {} }).catch(() => {});
                  return false;
                }
                return true;
              }
              if (mod && !kev.shiftKey && !kev.altKey && kev.code === 'KeyV') {
                kev.preventDefault();
                TC.clip.paste().then((text) => { if (text) { try { term.paste(text); } catch (e) {} } }).catch(() => {});
                return false;
              }
              if (!mod && kev.shiftKey && !kev.altKey && kev.code === 'Insert') {
                kev.preventDefault();
                TC.clip.paste().then((text) => { if (text) { try { term.paste(text); } catch (e) {} } }).catch(() => {});
                return false;
              }
              return true;
            });
          } catch (e) {}
          try {
            const res = await TC.pty.spawn({
              id: t.id,
              preset: t.preset === 'custom' ? 'custom' : t.preset,
              command: t.command, args: t.args || [], cwd: t.cwd,
              useConpty: Settings.data.ptyBackend === 'conpty',
              cols: term.cols, rows: term.rows
            });
            rec._sentCols = term.cols;
            rec._sentRows = term.rows;
            if (this.view !== 'canvas' || !this.currentProject) {
              try { await TC.pty.kill(t.id); } catch (e) {}
              try { term.dispose(); } catch (e) {}
              this.ptyMap.delete(t.id);
              return;
            }
            if (t.__attachGen !== myGen) {
              // Superseded by a newer attach (e.g. double restart): only tear
              // down what we created, never the live replacement.
              if (this.ptyMap.get(t.id) === rec) {
                this.ptyMap.delete(t.id);
                try { await TC.pty.kill(t.id); } catch (e) {}
              }
              try { term.dispose(); } catch (e) {}
              return;
            }
            if (res && res.error) {
              const cliName = presetById(t.preset).name || t.preset;
              let missing = String(res.error).startsWith('MISSING_CLI:');
              let missingProbe = missing ? String(res.error).slice('MISSING_CLI:'.length) : null;
              if (!missing && /ENOENT|error code:\s*2|cannot find|not recognized|not found|CreateProcess failed/i.test(res.error || '')) {
                try {
                  if (t.preset === 'custom') {
                    const probe = presetProbeCmd('custom', t.command);
                    if (probe) {
                      const hit = await TC.pty.which({ __c: probe });
                      if (!hit.__c) { missing = true; missingProbe = probe; }
                    }
                  } else {
                    const avail = await cliAvailability();
                    if (avail && avail[t.preset] === false) {
                      missing = true;
                      missingProbe = presetProbeCmd(t.preset, t.command);
                    }
                  }
                } catch (e) {}
                if (!missing) missing = true; // message matched a known "not found" signature
                if (!missingProbe) missingProbe = presetProbeCmd(t.preset, t.command) || t.preset;
              }
              term.writeln('\x1b[31mCould not start ' + cliName + '\x1b[0m');
              if (missing) {
                term.writeln(`'${missingProbe || t.preset}' was not found on PATH. Install it, then card menu → Restart session.`);
                const hint = CLI_INSTALL_HINTS[t.preset];
                if (hint) term.writeln('Try: ' + hint);
              } else {
                term.writeln(res.error);
                term.writeln('Check the working directory and command, then card menu → Restart session. If this persists, delete this card and recreate it after reinstalling the CLI.');
              }
            } else if (res && res.cwd) {
              t.cwd = res.cwd;
            }
          } catch (e) {
            try { term.writeln('\x1b[31mPTY unavailable: ' + e.message + '\x1b[0m'); } catch (_) {}
          }
          try {
            rec.ro = new ResizeObserver(() => {
              try { fit && fit.fit(); } catch (e) {}
              this.requestPtyResize(rec, t.id);
            });
            rec.ro.observe(host);
          } catch (e) {}
        },

        applyTermOptionsTo(rec) {
          if (!rec || !rec.term) return;
          try {
            rec.term.options.fontFamily = termFontStack();
            rec.term.options.fontSize = Settings.data.fontSize || 14;
            rec.term.options.fontWeight = termWeight();
            rec.term.options.minimumContrastRatio = Settings.data.boostContrast !== false ? 4.5 : 1;
            rec.term.options.cursorStyle = Settings.data.cursorStyle || 'block';
            rec.term.options.cursorBlink = Settings.data.cursorBlink !== false;
            const sb = parseInt(Settings.data.scrollback, 10);
            rec.term.options.scrollback = Number.isFinite(sb) ? Math.max(0, Math.min(10000, sb)) : 3000;
            if (rec.fit) rec.fit.fit();
            this.requestPtyResize(rec, rec.ptyId);
          } catch (e) {}
        },

        applyTermOptionsAll() {
          for (const [, rec] of this.ptyMap) this.applyTermOptionsTo(rec);
        },

        // Refit terminals to their on-screen size (keeps glyphs crisp at any
        // canvas zoom instead of scaling a stale raster).
        refitAllTerms() {
          if (DEMO || !this.currentProject) return;
          for (const [, rec] of this.ptyMap) {
            if (!rec || !rec.term) continue;
            try { rec.fit && rec.fit.fit(); } catch (e) {}
            this.requestPtyResize(rec, rec.ptyId);
          }
        },

        scheduleRefit() {
          clearTimeout(this._refitT);
          this._refitT = setTimeout(() => this.refitAllTerms(), 280);
        },

        async respawnAllPtys() {
          if (DEMO || !this.currentProject) return;
          const terms = [...(this.currentProject.terminals || [])];
          for (const t of terms) {
            await this.reattachPTY(t.id);
          }
        },

        // Kill + respawn with a grace period: the backend needs a moment to
        // fully tear down a session before an identical one can start cleanly.
        async reattachPTY(id) {
          if (DEMO) return;
          const t = (this.currentProject?.terminals || []).find(x => x.id === id);
          if (!t) return;
          await this.killPty(id);
          await new Promise((r) => setTimeout(r, 600));
          if (this.view !== 'canvas') return;
          const live = (this.currentProject?.terminals || []).find(x => x.id === id);
          if (live) await this.attachPTY(live);
        },

        async respawnPTY(id) {
          if (DEMO) return;
          await this.reattachPTY(id);
          this.toast('Session restarted');
        },

        appendTerminalLine(t, text, type = 'sys') {
          t.history = t.history || [];
          t.history.push({ text, type });
          if (t.history.length > 80) t.history.shift();

          const scroll = document.getElementById(`term-scroll-${t.id}`);
          if (scroll) {
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            line.textContent = text;
            scroll.appendChild(line);
            scroll.scrollTop = scroll.scrollHeight;
          }
          this.scheduleSave();
        },

        handleCommand(t, cmd) {
          const preset = PRESETS.find(p => p.id === t.preset) || PRESETS[0];
          this.appendTerminalLine(t, `${preset.prompt} ${cmd}`, 'cmd');

          const parts = cmd.split(' ');
          const action = parts[0].toLowerCase();

          if (action === 'clear' || action === 'cls') {
            t.history = [];
            const scroll = document.getElementById(`term-scroll-${t.id}`);
            if (scroll) scroll.innerHTML = '';
            this.scheduleSave();
            return;
          }

          if (action === 'help') {
            this.appendTerminalLine(t, 'Available commands:', 'sys');
            this.appendTerminalLine(t, '  help             - Displays this command reference', 'sys');
            this.appendTerminalLine(t, '  clear / cls      - Clears the terminal screen', 'sys');
            this.appendTerminalLine(t, '  ls / dir         - Lists simulated project files', 'sys');
            this.appendTerminalLine(t, '  cat <file>       - Prints content of file', 'sys');
            this.appendTerminalLine(t, '  agent <prompt>   - Dispatches a prompt to the AI agent', 'ai');
            this.appendTerminalLine(t, '  status           - Shows session health and connected wires', 'sys');
            this.appendTerminalLine(t, '  echo <text>      - Echoes back text', 'sys');
            this.appendTerminalLine(t, '  date             - Prints current timestamp', 'sys');
            this.appendTerminalLine(t, '  run <script>     - Executes an automated task', 'sys');
            return;
          }

          if (action === 'ls' || action === 'dir') {
            this.appendTerminalLine(t, 'Directory: C:\\workspace\\canval', 'sys');
            this.appendTerminalLine(t, 'Mode          Length Name', 'sys');
            this.appendTerminalLine(t, '----          ------ ----', 'sys');
            this.appendTerminalLine(t, 'd-----               src/', 'sys');
            this.appendTerminalLine(t, 'd-----               public/', 'sys');
            this.appendTerminalLine(t, '-a----          1420 index.html', 'success');
            this.appendTerminalLine(t, '-a----           845 package.json', 'success');
            this.appendTerminalLine(t, '-a----           139 metadata.json', 'success');
            this.appendTerminalLine(t, '-a----           512 agents.config.json', 'success');
            return;
          }

          if (action === 'cat') {
            const file = parts[1] || '';
            if (file.includes('package')) {
              this.appendTerminalLine(t, '{\n  "name": "canval",\n  "version": "2.4.0",\n  "fluent": true\n}', 'success');
            } else if (file.includes('agents')) {
              this.appendTerminalLine(t, '{\n  "models": ["claude-3-5-sonnet", "gemini-2.0-flash", "codex"]\n}', 'success');
            } else {
              this.appendTerminalLine(t, `cat: ${file || 'unspecified'}: simulated file content loaded successfully.`, 'sys');
            }
            return;
          }

          if (action === 'date') {
            this.appendTerminalLine(t, new Date().toLocaleString(), 'sys');
            return;
          }

          if (action === 'echo') {
            this.appendTerminalLine(t, parts.slice(1).join(' '), 'sys');
            return;
          }

          if (action === 'status') {
            const connectedWires = (this.currentProject.wires || []).filter(w => w.fromId === t.id || w.toId === t.id).length;
            this.appendTerminalLine(t, `Terminal: ${t.name} (${preset.name})`, 'success');
            this.appendTerminalLine(t, `Connected Wires: ${connectedWires}`, 'sys');
            this.appendTerminalLine(t, `Memory: 42.8 MB | CPU: 0.2% | Latency: 12ms`, 'sys');
            return;
          }

          if (action === 'agent' || action === 'ask' || action === 'claude' || action === 'gemini') {
            const prompt = parts.slice(1).join(' ') || 'analyze canvas workspace';
            this.appendTerminalLine(t, `Dispatching to ${preset.name}: "${prompt}"...`, 'sys');
            setTimeout(() => {
              const answers = [
                `[${preset.name}] Synthesized workspace context: 2 nodes evaluated. All pipeline criteria met.`,
                `[${preset.name}] Workflow note detected. Ready to execute deployment command.`,
                `[${preset.name}] Task executed smoothly with zero syntax violations.`
              ];
              const reply = answers[Math.floor(Math.random() * answers.length)];
              this.appendTerminalLine(t, reply, 'ai');
            }, 500);
            return;
          }

          if (action === 'run') {
            const script = parts[1] || 'build';
            this.appendTerminalLine(t, `Executing script: ${script}...`, 'sys');
            setTimeout(() => this.appendTerminalLine(t, `[1/3] Validating dependencies... OK`, 'sys'), 250);
            setTimeout(() => this.appendTerminalLine(t, `[2/3] Compiling modern assets... OK`, 'sys'), 500);
            setTimeout(() => this.appendTerminalLine(t, `[3/3] Task '${script}' finished in 0.74s.`, 'success'), 750);
            return;
          }

          // Fallback simulation
          this.appendTerminalLine(t, `Command executed: '${cmd}'. Type 'help' for built-in commands.`, 'sys');
        },

        /* --- Wire Routing & Connections --- */
        startWireDraft(fromId, fromPort, e) {
          const fromCard = this.findCard(fromId);
          if (!fromCard) return;
          document.body.classList.add('is-wiring');
          this.wireDraft = {
            fromId,
            fromPort,
            toPos: this.screenToWorld(e.clientX, e.clientY),
            targetId: null,
            targetPort: null,
            hoverPort: null
          };
          this.drawWires();

          let wireRaf = 0;
          let wireLatest = null;

          const cancelWire = () => {
            if (wireRaf) { cancelAnimationFrame(wireRaf); wireRaf = 0; }
            wireLatest = null;
            document.body.classList.remove('is-wiring');
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            this.wireDraft = null;
            this.drawWires();
          };

          const stepWire = (cx, cy) => {
            if (!this.wireDraft) return;
            const worldMouse = this.screenToWorld(cx, cy);

            // Magnetic snap to nearest port within 28px
            let snapped = null;
            const threshold = 28;
            const p = this.currentProject;
            const allCards = [...(p.terminals || []), ...(p.notes || [])];

            for (const c of allCards) {
              const ports = ['n', 's', 'w', 'e'];
              for (const portName of ports) {
                if (c.id === fromId && portName === fromPort) continue;
                const coord = this.getPortCoord(c, portName);
                const dist = Math.hypot(worldMouse.x - coord.x, worldMouse.y - coord.y);
                if (dist < threshold) {
                  snapped = { cardId: c.id, port: portName, coord };
                  break;
                }
              }
              if (snapped) break;
            }

            if (snapped) {
              this.wireDraft.toPos = snapped.coord;
              this.wireDraft.targetId = snapped.cardId;
              this.wireDraft.targetPort = snapped.port;
              this.wireDraft.hoverPort = snapped.port;
            } else {
              this.wireDraft.toPos = worldMouse;
              const hoveredCard = allCards.find(c =>
                worldMouse.x >= c.x - 4 && worldMouse.x <= c.x + c.w + 4 &&
                worldMouse.y >= c.y - 4 && worldMouse.y <= c.y + c.h + 4
              );
              this.wireDraft.targetId = hoveredCard ? hoveredCard.id : null;
              this.wireDraft.targetPort = null;
              this.wireDraft.hoverPort = null;
            }
            this.drawWires();
          };

          const onMove = (ev) => {
            if (!this.wireDraft) return;
            // Released outside the window: abort the draft instead of sticking.
            if (ev.buttons === 0) { cancelWire(); return; }
            wireLatest = { x: ev.clientX, y: ev.clientY };
            if (wireRaf) return;
            wireRaf = requestAnimationFrame(() => {
              wireRaf = 0;
              const cur = wireLatest;
              wireLatest = null;
              if (cur) stepWire(cur.x, cur.y);
            });
          };

          const onUp = (ev) => {
            if (wireRaf) { cancelAnimationFrame(wireRaf); wireRaf = 0; }
            document.body.classList.remove('is-wiring');
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            const draft = this.wireDraft;
            this.wireDraft = null;

            if (draft) {
              if (draft.targetId && draft.targetPort) {
                this.addWire(draft.fromId, draft.fromPort, draft.targetId, draft.targetPort);
              } else {
                const targetEl = document.elementFromPoint(ev.clientX, ev.clientY);
                const cardEl = targetEl ? targetEl.closest('.canvas-card') : null;
                if (cardEl) {
                  const portEl = targetEl.classList.contains('card-port') ? targetEl : null;
                  const toPort = portEl ? portEl.dataset.port : 'w';
                  if (cardEl.dataset.id !== draft.fromId || toPort !== draft.fromPort) {
                    this.addWire(draft.fromId, draft.fromPort, cardEl.dataset.id, toPort);
                  }
                }
              }
            }
            this.drawWires();
          };

          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        },

        addWire(fromId, fromPort, toId, toPort) {
          const p = this.currentProject;
          p.wires = p.wires || [];
          // Avoid exact duplicates
          if (p.wires.some(w => (w.fromId === fromId && w.toId === toId) || (w.fromId === toId && w.toId === fromId))) {
            this.toast('Connection already exists');
            return;
          }
          p.wires.push({
            id: uid(),
            fromId,
            fromPort,
            toId,
            toPort
          });
          this.toast('Connected');
          this.scheduleSave();
          this.drawWires();
        },

        getPortCoord(item, port) {
          const x = item.x;
          const y = item.y;
          const w = item.w;
          const h = item.h;
          // Coordinates sit right on the perimeter edge of the card (centered in the port bead)
          if (port === 'n') return { x: x + w / 2, y: y };
          if (port === 's') return { x: x + w / 2, y: y + h };
          if (port === 'w') return { x: x, y: y + h / 2 };
          return { x: x + w, y: y + h / 2 }; // 'e'
        },

        calculateOrthogonalPath(p1, p2, port1, port2, fromCardId = null, toCardId = null) {
          const p = this.currentProject;
          const allCards = [...(p?.terminals || []), ...(p?.notes || [])];

          const fromCard = fromCardId ? this.findCard(fromCardId) : null;
          const toCard = toCardId ? this.findCard(toCardId) : null;

          const getNormal = (port) => {
            if (port === 'e') return { x: 1, y: 0 };
            if (port === 'w') return { x: -1, y: 0 };
            if (port === 's') return { x: 0, y: 1 };
            if (port === 'n') return { x: 0, y: -1 };
            return { x: 1, y: 0 };
          };

          const n1 = getNormal(port1);
          const stub = 22;
          const s1 = { x: p1.x + n1.x * stub, y: p1.y + n1.y * stub };

          // Determine port2 normal if not specified or preview
          let effectivePort2 = port2;
          if (!effectivePort2) {
            if (toCard && toCard.id === fromCardId) {
              // Point inward toward mouse from nearest boundary
              if (p2.x < fromCard.x + fromCard.w / 2) {
                effectivePort2 = 'w';
              } else {
                effectivePort2 = 'e';
              }
            } else if (Math.abs(p2.x - s1.x) >= Math.abs(p2.y - s1.y)) {
              effectivePort2 = p2.x >= s1.x ? 'w' : 'e';
            } else {
              effectivePort2 = p2.y >= s1.y ? 'n' : 's';
            }
          }
          const n2 = getNormal(effectivePort2);
          const dist12 = Math.hypot(p2.x - s1.x, p2.y - s1.y);
          const stub2 = port2 ? stub : Math.min(stub, Math.max(0, dist12 / 3));
          const s2 = { x: p2.x + n2.x * stub2, y: p2.y + n2.y * stub2 };

          // Card interior collision detection - completely avoid card interiors
          const hitsCardInterior = (x1, y1, x2, y2, c) => {
            const iLeft = c.x + 1;
            const iRight = c.x + c.w - 1;
            const iTop = c.y + 1;
            const iBottom = c.y + c.h - 1;
            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);
            return maxX > iLeft && minX < iRight && maxY > iTop && minY < iBottom;
          };

          const pathCollisionScore = (points) => {
            let interiorHits = 0;
            // Test intermediate segments between s1 and s2
            for (let i = 1; i < points.length - 2; i++) {
              const a = points[i];
              const b = points[i + 1];
              for (const card of allCards) {
                if (hitsCardInterior(a.x, a.y, b.x, b.y, card)) {
                  interiorHits++;
                }
              }
            }

            // Manhattan distance & bend count
            let length = 0;
            let bends = 0;
            for (let i = 0; i < points.length - 1; i++) {
              const dx = points[i + 1].x - points[i].x;
              const dy = points[i + 1].y - points[i].y;
              length += Math.abs(dx) + Math.abs(dy);
              if (i > 0 && i < points.length - 1) {
                const prevDx = points[i].x - points[i - 1].x;
                const prevDy = points[i].y - points[i - 1].y;
                if ((prevDx !== 0 && dy !== 0) || (prevDy !== 0 && dx !== 0)) {
                  bends++;
                }
              }
            }

            // Heavily penalize cutting through any card interior
            return (interiorHits * 10000000) + length + (bends * 35);
          };

          // Collect clearance routing channels
          const margin = 26;
          const xTracks = new Set([
            s1.x,
            s2.x,
            (s1.x + s2.x) / 2
          ]);
          const yTracks = new Set([
            s1.y,
            s2.y,
            (s1.y + s2.y) / 2
          ]);

          // Clearance tracks around fromCard (ensures wires can loop around its own card cleanly)
          if (fromCard) {
            xTracks.add(fromCard.x - margin);
            xTracks.add(fromCard.x + fromCard.w + margin);
            yTracks.add(fromCard.y - margin);
            yTracks.add(fromCard.y + fromCard.h + margin);
          }

          // Clearance tracks around toCard
          if (toCard) {
            xTracks.add(toCard.x - margin);
            xTracks.add(toCard.x + toCard.w + margin);
            yTracks.add(toCard.y - margin);
            yTracks.add(toCard.y + toCard.h + margin);
          }

          // Clearance tracks around obstacle cards near the corridor
          const cLeft = Math.min(s1.x, s2.x) - 40;
          const cRight = Math.max(s1.x, s2.x) + 40;
          const cTop = Math.min(s1.y, s2.y) - 40;
          const cBottom = Math.max(s1.y, s2.y) + 40;

          allCards.forEach(c => {
            if (c.x + c.w > cLeft && c.x < cRight && c.y + c.h > cTop && c.y < cBottom) {
              xTracks.add(c.x - margin);
              xTracks.add(c.x + c.w + margin);
              yTracks.add(c.y - margin);
              yTracks.add(c.y + c.h + margin);
            }
          });

          const candidates = [];

          // Standard L-shapes
          candidates.push([p1, s1, { x: s2.x, y: s1.y }, s2, p2]);
          candidates.push([p1, s1, { x: s1.x, y: s2.y }, s2, p2]);

          // Z-shapes across X tracks
          for (const x of xTracks) {
            candidates.push([p1, s1, { x, y: s1.y }, { x, y: s2.y }, s2, p2]);
          }

          // Z-shapes across Y tracks
          for (const y of yTracks) {
            candidates.push([p1, s1, { x: s1.x, y }, { x: s2.x, y }, s2, p2]);
          }

          // C-shapes / Perimeter-wrap paths (for going around own card or around intervening obstacles)
          for (const x of xTracks) {
            for (const y of yTracks) {
              candidates.push([p1, s1, { x, y: s1.y }, { x, y }, { x: s2.x, y }, s2, p2]);
              candidates.push([p1, s1, { x: s1.x, y }, { x, y }, { x, y: s2.y }, s2, p2]);
            }
          }

          // Pick candidate with lowest score (priority: 0 collisions, then shortest length, then least bends)
          let bestWaypoints = null;
          let bestScore = Infinity;

          for (const cand of candidates) {
            const score = pathCollisionScore(cand);
            if (score < bestScore) {
              bestScore = score;
              bestWaypoints = cand;
            }
          }

          if (!bestWaypoints) {
            bestWaypoints = [p1, s1, { x: (s1.x + s2.x) / 2, y: s1.y }, { x: (s1.x + s2.x) / 2, y: s2.y }, s2, p2];
          }

          // Simplify collinear points
          const simplified = [bestWaypoints[0]];
          for (let i = 1; i < bestWaypoints.length - 1; i++) {
            const prev = simplified[simplified.length - 1];
            const curr = bestWaypoints[i];
            const next = bestWaypoints[i + 1];

            const isCollinearX = Math.abs(prev.x - curr.x) < 0.5 && Math.abs(curr.x - next.x) < 0.5;
            const isCollinearY = Math.abs(prev.y - curr.y) < 0.5 && Math.abs(curr.y - next.y) < 0.5;
            const isSame = Math.abs(prev.x - curr.x) < 0.5 && Math.abs(prev.y - curr.y) < 0.5;

            if (!isCollinearX && !isCollinearY && !isSame) {
              simplified.push(curr);
            }
          }
          simplified.push(bestWaypoints[bestWaypoints.length - 1]);

          // Build SVG path with rounded elbow corners (radius R = 6)
          const R = 6;
          let d = `M ${simplified[0].x} ${simplified[0].y}`;
          for (let i = 1; i < simplified.length - 1; i++) {
            const pPrev = simplified[i - 1];
            const pCurr = simplified[i];
            const pNext = simplified[i + 1];

            const d1 = Math.hypot(pCurr.x - pPrev.x, pCurr.y - pPrev.y);
            const d2 = Math.hypot(pNext.x - pCurr.x, pNext.y - pCurr.y);
            const cornerRadius = Math.min(R, d1 / 2, d2 / 2);

            if (d1 === 0 || d2 === 0) continue;

            const v1x = (pCurr.x - pPrev.x) / d1;
            const v1y = (pCurr.y - pPrev.y) / d1;
            const v2x = (pNext.x - pCurr.x) / d2;
            const v2y = (pNext.y - pCurr.y) / d2;

            const startCornerX = pCurr.x - v1x * cornerRadius;
            const startCornerY = pCurr.y - v1y * cornerRadius;
            const endCornerX = pCurr.x + v2x * cornerRadius;
            const endCornerY = pCurr.y + v2y * cornerRadius;

            d += ` L ${startCornerX} ${startCornerY} Q ${pCurr.x} ${pCurr.y} ${endCornerX} ${endCornerY}`;
          }
          const last = simplified[simplified.length - 1];
          d += ` L ${last.x} ${last.y}`;

          // Midpoint calculation
          let totalLen = 0;
          const segLens = [];
          for (let i = 0; i < simplified.length - 1; i++) {
            const l = Math.hypot(simplified[i + 1].x - simplified[i].x, simplified[i + 1].y - simplified[i].y);
            segLens.push(l);
            totalLen += l;
          }

          const halfLen = totalLen / 2;
          let accum = 0;
          let midX = (simplified[0].x + last.x) / 2;
          let midY = (simplified[0].y + last.y) / 2;

          for (let i = 0; i < segLens.length; i++) {
            if (accum + segLens[i] >= halfLen) {
              const rem = halfLen - accum;
              const ratio = segLens[i] > 0 ? rem / segLens[i] : 0;
              midX = simplified[i].x + (simplified[i + 1].x - simplified[i].x) * ratio;
              midY = simplified[i].y + (simplified[i + 1].y - simplified[i].y) * ratio;
              break;
            }
            accum += segLens[i];
          }

          return { d, midX, midY, waypoints: simplified };
        },

        drawWires() {
          const svg = document.getElementById('wires-svg');
          if (!svg || !this.currentProject) return;

          const p = this.currentProject;
          const wires = p.wires || [];
          let pathsHtml = '';
          let selMid = null;

          wires.forEach(w => {
            const fromCard = this.findCard(w.fromId);
            const toCard = this.findCard(w.toId);
            if (!fromCard || !toCard) return;

            const p1 = this.getPortCoord(fromCard, w.fromPort || 'e');
            const p2 = this.getPortCoord(toCard, w.toPort || 'w');
            const info = this.calculateOrthogonalPath(p1, p2, w.fromPort || 'e', w.toPort || 'w', w.fromId, w.toId);
            const isSel = this.selectedId === 'wire:' + w.id;
            const customStroke = w.color ? ` style="stroke:${w.color}"` : '';
            const customBead = w.color ? ` style="fill:${w.color};stroke:${w.color}"` : '';
            const dashAttr = w.dash ? ` stroke-dasharray="${w.dash}"` : '';
            if (isSel) selMid = { x: info.midX, y: info.midY, id: w.id };

            pathsHtml += `
              <g class="wire-group ${isSel ? 'selected' : ''}" data-wire="${w.id}">
                <path class="wire-hitbox" data-wire="${w.id}" d="${info.d}" />
                <path class="wire-path ${isSel ? 'selected' : ''}" data-wire="${w.id}" d="${info.d}"${customStroke}${dashAttr} />
                <circle class="wire-bead ${isSel ? 'selected' : ''}" cx="${p1.x}" cy="${p1.y}" r="3"${customBead} />
                <circle class="wire-bead ${isSel ? 'selected' : ''}" cx="${p2.x}" cy="${p2.y}" r="3"${customBead} />
              </g>
            `;
          });

          // Draw active draft wire if present
          if (this.wireDraft) {
            const fromCard = this.findCard(this.wireDraft.fromId);
            if (fromCard) {
              const p1 = this.getPortCoord(fromCard, this.wireDraft.fromPort);
              const p2 = this.wireDraft.toPos;
              const info = this.calculateOrthogonalPath(
                p1,
                p2,
                this.wireDraft.fromPort,
                this.wireDraft.targetPort || this.wireDraft.hoverPort || null,
                this.wireDraft.fromId,
                this.wireDraft.targetId || null
              );
              pathsHtml += `
                <path class="wire-path preview" d="${info.d}" />
                <circle class="wire-bead" cx="${p1.x}" cy="${p1.y}" r="3" />
                <circle class="wire-bead" cx="${p2.x}" cy="${p2.y}" r="3" />
              `;
            }
          }

          svg.innerHTML = pathsHtml;

          // Wire hitboxes for clicking/selecting wire
          svg.querySelectorAll('.wire-hitbox, .wire-path').forEach(el => {
            el.onmousedown = (e) => {
              e.stopPropagation();
              this.selectedId = 'wire:' + el.dataset.wire;
              this.selectedIds = [];
              this.renderCards();
              this.drawWires();
              this.updateStatusBar();
            };
            el.oncontextmenu = (e) => {
              e.preventDefault();
              e.stopPropagation();
              this.selectedId = 'wire:' + el.dataset.wire;
              this.selectedIds = [];
              this.drawWires();
              this.showMenu(e.clientX, e.clientY, [
                {
                  label: 'Disconnect Wire',
                  icon: Icons.trash,
                  danger: true,
                  action: () => this.deleteWire(el.dataset.wire)
                }
              ]);
            };
          });

          // Wire color + disconnect flyout for the selected wire
          this.updateWireFlyout(selMid);
        },

        updateWireFlyout(mid) {
          const fly = document.getElementById('wire-flyout');
          if (!fly) return;
          if (mid) this._wireFlyMid = mid;
          const sel = (typeof this.selectedId === 'string' && this.selectedId.startsWith('wire:') && this.currentProject)
            ? (this.currentProject.wires || []).find(w => 'wire:' + w.id === this.selectedId)
            : null;
          const anchor = mid || this._wireFlyMid;
          if (!sel || !anchor || this.view !== 'canvas' || !this.currentProject) {
            fly.classList.add('hidden');
            if (!sel) this._wireFlyMid = null;
            return;
          }
          const vp = document.getElementById('canvas-viewport');
          const vr = vp.getBoundingClientRect();
          const cam = this.currentProject.camera;
          const sx = anchor.x * cam.zoom + cam.x;
          const sy = anchor.y * cam.zoom + cam.y;
          fly.style.left = Math.max(8, Math.min(vr.width - 196, sx - 92)) + 'px';
          fly.style.top = Math.max(8, sy - 214) + 'px';
          fly.innerHTML = `<div class="wire-fly-title">Wire color</div>
            <div class="wire-fly-swatches">${WIRE_COLORS.map(c => `<button class="wire-swatch ${(!sel.color && !c.value) || sel.color === c.value ? 'on' : ''}" data-c="${c.value || ''}" title="${c.name}" style="${c.value ? `background:${c.value}` : 'background:linear-gradient(135deg,#9a9a9a,#545454)'}"></button>`).join('')}</div>
            <div class="wire-fly-title">Line style</div>
            <div class="wire-fly-styles">${WIRE_DASHES.map(d => `<button class="wire-style-btn ${(!sel.dash && !d.dash) || sel.dash === d.dash ? 'on' : ''}" data-d="${d.dash || ''}" title="${d.name}"><svg width="36" height="10"><line x1="2" y1="5" x2="34" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"${d.dash ? ` stroke-dasharray="${d.dash}"` : ''}/></svg></button>`).join('')}</div>
            <button class="wire-fly-del" type="button">${Icons.trash}<span>Disconnect</span></button>`;
          fly.querySelectorAll('.wire-swatch').forEach(b => b.onclick = (e) => {
            e.stopPropagation();
            sel.color = b.dataset.c || undefined;
            this.scheduleSave();
            this.drawWires();
            this.updateMinimap();
          });
          fly.querySelectorAll('.wire-style-btn').forEach(b => b.onclick = (e) => {
            e.stopPropagation();
            sel.dash = b.dataset.d || undefined;
            this.scheduleSave();
            this.drawWires();
            this.updateMinimap();
          });
          fly.querySelector('.wire-fly-del').onclick = (e) => {
            e.stopPropagation();
            this.deleteWire(sel.id);
          };
          fly.classList.remove('hidden');
        },

        /* --- Camera & Pan/Zoom --- */
        screenToWorld(clientX, clientY) {
          const viewport = document.getElementById('canvas-viewport');
          const rect = viewport.getBoundingClientRect();
          const cam = this.currentProject.camera;
          return {
            x: (clientX - rect.left - cam.x) / cam.zoom,
            y: (clientY - rect.top - cam.y) / cam.zoom
          };
        },

        applyCamera() {
          const cam = this.currentProject.camera;
          const world = document.getElementById('canvas-world');
          const grid = document.getElementById('canvas-grid-bg');
          world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.zoom})`;

          const s = this.currentProject.settings = this.currentProject.settings || {};
          const isGridOn = s.grid !== false;
          const gridStyle = s.gridStyle || 'dots';
          const baseSize = s.gridSize || 24;
          const size = baseSize * cam.zoom;

          grid.style.display = isGridOn ? 'block' : 'none';
          if (isGridOn) {
            const lightGrid = document.documentElement.dataset.theme === 'light';
            const lineCol = lightGrid ? 'rgba(0, 0, 0, 0.07)' : 'rgba(255, 255, 255, 0.065)';
            const faintCol = lightGrid ? 'rgba(0, 0, 0, 0.1)' : 'rgba(255, 255, 255, 0.09)';
            const strongCol = lightGrid ? 'rgba(0, 0, 0, 0.22)' : 'rgba(255, 255, 255, 0.18)';
            const dotCol = lightGrid ? 'rgba(0, 0, 0, 0.14)' : 'rgba(255, 255, 255, 0.09)';
            grid.style.backgroundSize = `${size}px ${size}px`;
            grid.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
            if (gridStyle === 'lines') {
              grid.style.backgroundImage = `linear-gradient(to right, ${lineCol} 1px, transparent 1px), linear-gradient(to bottom, ${lineCol} 1px, transparent 1px)`;
            } else if (gridStyle === 'crosses') {
              grid.style.backgroundImage = `radial-gradient(circle, ${strongCol} 1.5px, transparent 1.5px), linear-gradient(to right, transparent 46%, ${faintCol} 46%, ${faintCol} 54%, transparent 54%), linear-gradient(to bottom, transparent 46%, ${faintCol} 46%, ${faintCol} 54%, transparent 54%)`;
            } else {
              // dots (default)
              grid.style.backgroundImage = `radial-gradient(${dotCol} 1.2px, transparent 1.6px)`;
            }
          }

          const pct = Math.round(cam.zoom * 100) + '%';
          const railVal = document.getElementById('zoom-rail-val');
          if (railVal) railVal.textContent = pct;

          this.updateGridButtonState();
          this.updateMinimap();
          this.updateWireFlyout(this._wireFlyMid);
        },

        updateGridButtonState() {
          if (!this.currentProject) return;
          const s = this.currentProject.settings = this.currentProject.settings || {};
          const isGridOn = s.grid !== false;
          const gridStyle = s.gridStyle || 'dots';
          const isSnapOn = s.snap !== false;

          const btnGrid = document.getElementById('btn-grid-menu');
          const btnGridLabel = document.getElementById('btn-grid-label');
          if (btnGrid && btnGridLabel) {
            btnGrid.classList.toggle('active', isGridOn);
            const styleName = !isGridOn ? 'Off' : (gridStyle === 'lines' ? 'Lines' : (gridStyle === 'crosses' ? 'Crosses' : 'Dots'));
            btnGridLabel.textContent = `Grid: ${styleName}`;
          }

          const btnSnap = document.getElementById('btn-toggle-snap');
          const btnSnapLabel = document.getElementById('btn-snap-label');
          if (btnSnap && btnSnapLabel) {
            btnSnap.classList.toggle('active', isSnapOn);
            btnSnapLabel.textContent = isSnapOn ? 'Snap: On' : 'Snap: Off';
          }
        },

                this.toast('Grid pattern: Lines');

            {
